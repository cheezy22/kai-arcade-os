<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Warlords of Snacks</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0f1115;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#12151b;padding:12px;border-bottom:1px solid #303744;z-index:5}h1{font-size:20px;margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#1b2029;border-radius:12px;padding:8px;text-align:center;font-size:12px}.stat b{display:block;font-size:17px}main{padding:12px 12px 90px}.card,.zone{background:#191e27;border:1px solid #303744;border-radius:16px;padding:14px;margin-bottom:10px}.hero{background:#222a38}.hero h2{margin:0 0 6px}.small{color:#aeb7c6;font-size:13px}.btn{border:0;border-radius:12px;padding:12px;background:#344055;color:white;font-weight:700;margin:4px;min-height:46px}.good{background:#326747}.bad{background:#783b3b}.primary{background:#3d5f9e}.map{display:grid;grid-template-columns:1fr 1fr;gap:9px}.zone{margin:0}.zone h3{font-size:15px;margin:6px 0}.emoji{font-size:30px}.badge{display:inline-block;background:#2b3340;border-radius:20px;padding:4px 7px;font-size:11px;margin:2px}.owned{outline:2px solid #46845a}.enemy{outline:2px solid #854848}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#151922;border-top:1px solid #303744;padding-bottom:env(safe-area-inset-bottom);z-index:9}nav button{border:0;background:transparent;color:#e6e9ef;padding:10px 2px;font-size:11px;min-height:62px}nav span{display:block;font-size:23px}.active{background:#252c39!important}.row{padding:10px 0;border-bottom:1px solid #2b313b}</style></head><body><header><h1>⚔️ Warlords of Snacks: Apocalypse</h1><div class="stats"><div class="stat">🍪 Snacks<b id="snacks">120</b></div><div class="stat">⚡ Energy<b id="energy">8</b></div><div class="stat">🛡️ Power<b id="power">3</b></div><div class="stat">🏆 Glory<b id="glory">0</b></div></div></header><main id="main"></main><nav><button data-tab="hq" class="active"><span>🏠</span>HQ</button><button data-tab="map"><span>🗺️</span>Map</button><button data-tab="squad"><span>🐾</span>Squad</button><button data-tab="missions"><span>🎯</span>Missions</button><button data-tab="log"><span>📜</span>Log</button></nav><script>var D={day:1,snacks:120,energy:8,power:3,glory:0,tab:'hq',up:{pantry:0,fort:0,radio:0},squad:[['🐶','Alfie','Scout Commander',3,10,1],['🐹','Ham Solo','Chaos Operative',4,8,1],['🐢','Bob','Heavy Armour',2,14,1]],zones:[['🍳','Kitchen Stronghold','you',2,16],['🚪','Hallway Corridor','you',1,10],['🛋️','Sofa Citadel','enemy',4,24],['🌿','Garden Wastes','enemy',5,28],['🛏️','Bedroom Keep','neutral',3,18],['🧰','Garage Vault','enemy',7,40]],log:['Day 1: Apocalypse management begins. Humanity remains alarmingly underqualified.']};function load(){try{return JSON.parse(localStorage.getItem('wosa2'))||JSON.parse(JSON.stringify(D))}catch(e){return JSON.parse(JSON.stringify(D))}}var S=load();function save(){try{localStorage.setItem('wosa2',JSON.stringify(S))}catch(e){}}function L(x){S.log.unshift('Day '+S.day+': '+x);save()}function own(){return S.zones.filter(function(z){return z[2]=='you'}).length}function stats(){document.getElementById('snacks').textContent=Math.floor(S.snacks);document.getElementById('energy').textContent=S.energy;document.getElementById('power').textContent=S.power;document.getElementById('glory').textContent=S.glory}function B(t,f,c,d){return '<button class="btn '+(c||'')+'" onclick="'+f+'" '+(d?'disabled':'')+'>'+t+'</button>'}function render(){stats();document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('active',b.dataset.tab==S.tab)});var m=document.getElementById('main');if(S.tab=='hq')m.innerHTML=hq();if(S.tab=='map')m.innerHTML=map();if(S.tab=='squad')m.innerHTML=squad();if(S.tab=='missions')m.innerHTML=missions();if(S.tab=='log')m.innerHTML=logs()}function hq(){var p=80+S.up.pantry*55,f=100+S.up.fort*65,r=90+S.up.radio*60;return '<div class="card hero"><h2>Day '+S.day+': Hold the House</h2><div class="small">You control '+own()+' of '+S.zones.length+' zones. Humanity is depending on a dog, hamster and tortoise. Excellent.</div></div><div class="card"><h3>Daily Command</h3>'+B('🔎 Scavenge (2⚡)','scavenge()','primary',S.energy<2)+B('🩹 Rest Squad (2⚡)','rest()','',S.energy<2)+B('⏭️ End Day','endDay()','good')+'</div><div class="card"><h3>Base Upgrades</h3><p>🍪 Pantry Lv.'+S.up.pantry+'</p>'+B('Upgrade '+p+'🍪','upgrade(\'pantry\','+p+')','good',S.snacks<p)+'<p>🛡️ Fortifications Lv.'+S.up.fort+'</p>'+B('Upgrade '+f+'🍪','upgrade(\'fort\','+f+')','good',S.snacks<f)+'<p>📡 Radio Lv.'+S.up.radio+'</p>'+B('Upgrade '+r+'🍪','upgrade(\'radio\','+r+')','good',S.snacks<r)+'</div>'}function map(){return '<div class="map">'+S.zones.map(function(z,i){return '<div class="zone '+(z[2]=='you'?'owned':z[2]=='enemy'?'enemy':'')+'"><div class="emoji">'+z[0]+'</div><h3>'+z[1]+'</h3><span class="badge">'+z[2].toUpperCase()+'</span><span class="badge">DEF '+z[3]+'</span><div>'+((z[2]=='you')?B('Collect '+z[4]+'🍪','collect('+i+')','good'):B('Attack 3⚡','attack('+i+')','bad',S.energy<3))+'</div></div>'}).join('')+'</div>'}function squad(){return '<div class="card"><h3>The Magnificent Idiots</h3>'+S.squad.map(function(x,i){return '<div class="row"><div class="emoji">'+x[0]+'</div><b>'+x[1]+'</b> <span class="small">'+x[2]+'</span><br><span class="badge">Lv '+x[5]+'</span><span class="badge">ATK '+x[3]+'</span><span class="badge">HP '+x[4]+'</span><br>'+B('Train 50🍪','train('+i+')','primary',S.snacks<50)+'</div>'}).join('')+'</div>'}function missions(){return '<div class="card"><h3>Operations</h3><div class="row"><b>📦 Raid the Cupboard</b><p class="small">Recover supplies before rival factions notice.</p>'+B('Deploy 2⚡','mission(2,40)','primary',S.energy<2)+'</div><div class="row"><b>🛰️ Pigeon Recon</b><p class="small">Interrogate local aerial intelligence.</p>'+B('Deploy 2⚡','mission(2,35)','primary',S.energy<2)+'</div><div class="row"><b>🍕 Frozen Pizza Retrieval</b><p class="small">Strategically vital. Obviously.</p>'+B('Deploy 3⚡','mission(3,60)','primary',S.energy<3)+'</div></div>'}function logs(){return '<div class="card"><h3>Campaign Log</h3>'+S.log.map(function(x){return '<div class="row">'+x+'</div>'}).join('')+B('Reset Campaign','reset()','bad')+'</div>'}function scavenge(){if(S.energy<2)return;S.energy-=2;var g=20+Math.floor(Math.random()*31);S.snacks+=g;L('Scavenging recovered '+g+' snacks.');render()}function rest(){if(S.energy<2)return;S.energy-=2;L('Squad rested. Bob claims he was already doing that.');render()}function collect(i){var z=S.zones[i];if(z[5]==S.day){alert('Already collected today.');return}z[5]=S.day;S.snacks+=z[4];L(z[1]+' produced '+z[4]+' snacks.');render()}function attack(i){if(S.energy<3)return;S.energy-=3;var z=S.zones[i],atk=S.power+S.squad.reduce(function(a,x){return a+x[3]},0)+Math.floor(Math.random()*6),def=z[3]*3+Math.floor(Math.random()*8);if(atk>=def){z[2]='you';S.snacks+=z[4];S.glory+=z[3]*4;L('VICTORY at '+z[1]+'.')}else L('Defeat at '+z[1]+'. The enemy displayed deeply unsporting competence.');render()}function train(i){if(S.snacks<50)return;S.snacks-=50;S.squad[i][3]++;S.squad[i][4]+=2;S.squad[i][5]++;L(S.squad[i][1]+' trained to level '+S.squad[i][5]+'.');render()}function mission(c,r){if(S.energy<c)return;S.energy-=c;if(Math.random()<.72){S.snacks+=r;S.glory+=5;L('Mission succeeded. +'+r+' snacks.')}else L('Mission failed. Ham Solo denies everything.');render()}function upgrade(k,c){if(S.snacks<c)return;S.snacks-=c;S.up[k]++;if(k=='fort')S.power++;L(k+' upgraded.');render()}function endDay(){S.day++;S.energy=8+Math.min(4,S.up.radio);var g=own()*8+S.up.pantry*5;S.snacks+=g;L('New day. Territory income +'+g+'.');render()}function reset(){if(confirm('Reset the apocalypse?')){S=JSON.parse(JSON.stringify(D));save();render()}}document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){S.tab=b.dataset.tab;save();render()})});render();</script></body></html>
