<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#070b13"><title>Warlords of Snacks — Kai Classic</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#061018}#top{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:7px;align-items:center;background:linear-gradient(#07111eea,#07111ea 70%,transparent);pointer-events:none}.brand{font-weight:950;font-size:14px;line-height:1}.brand small{display:block;color:#9fb3c8;font-size:10px;margin-top:3px}.pill{background:#101b29d9;border:1px solid #294158;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:800;white-space:nowrap}.grow{flex:1}.right{display:flex;gap:5px}#feed{position:fixed;z-index:4;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 82px);height:40px;overflow:hidden;border:1px solid #294158;border-radius:13px;background:#101926d9;backdrop-filter:blur(8px);padding:7px 10px;font-size:11px;line-height:13px;color:#dce9f6;pointer-events:none}#bar{position:fixed;z-index:7;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 7px);height:66px;border:1px solid #2a4057;border-radius:18px;background:#0d1521ef;backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px}button{border:0;border-radius:13px;background:#f4f7fb;color:#0c1420;font-weight:950;font-size:12px;padding:6px;min-width:0}button.on{background:#cfe7ff}button.danger{background:#ffe0dc}.modal{position:fixed;z-index:20;inset:0;background:#0008;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:78%;overflow:auto;background:#f5f7fa;color:#111;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 18px)}.sheet h2{margin:0 0 8px;font-size:18px}.sheet p{font-size:12px;color:#586575}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row button{border:1px solid #c9d1da;background:white;font-size:13px;padding:11px}.clans{display:grid;gap:8px}.clan{border:1px solid #ccd4dd;background:white;border-radius:14px;padding:10px;font-size:12px}.clan b{font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.hint{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 62px);left:10px;padding:7px 10px;border-radius:999px;background:#101926cf;border:1px solid #294158;font-size:10px;font-weight:900;color:#dae7f5;pointer-events:none}@media(orientation:landscape){#feed{left:auto;width:350px;bottom:calc(env(safe-area-inset-bottom) + 78px)}#bar{left:50%;right:auto;transform:translateX(-50%);width:min(620px,92vw)}}
</style></head><body><canvas id="game"></canvas><div id="top"><div class="brand">WARLORDS OF SNACKS<small>Dad's Crazy Simulation • Kai Classic</small></div><div class="grow"></div><div class="right"><div class="pill" id="year">Year 0</div><div class="pill" id="agents">0 souls</div></div></div><div class="hint" id="hint">👀 WATCH — drag map • pinch zoom</div><div id="feed">World booting…</div><div id="bar"><button id="pause">⏸ Pause</button><button id="watch" class="on">👀 Watch</button><button id="drop">🍖 Drop</button><button id="chaos" class="danger">🌀 Chaos</button><button id="more">☰ More</button></div><div class="modal" id="modal"><div class="sheet"><h2>World Control</h2><p>The clans run themselves. You interfere when you fancy it.</p><div class="row"><button id="addClan">➕ New Clan</button><button id="meteor">☄️ Meteor</button><button id="peace">🤝 Forced Peace</button><button id="war">⚔️ Start War</button><button id="reset">↻ New World</button><button id="close">Done</button></div><div class="clans" id="clans"></div></div></div><script>
(()=>{'use strict';const C=document.getElementById('game'),x=C.getContext('2d',{alpha:false});const $=s=>document.getElementById(s);let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);let paused=false,mode='watch',chaos=false,year=0,sim=0,last=performance.now(),cam={x:0,y:0,z:1},drag=null,pinch=0;const WORLD={w:1800,h:1100};const colors=['#55d66b','#ff5d66','#5aa7ff','#f3c74f','#b36cff','#ff8d3c','#2bd2c9','#f36fc3'];const names=['Thistle','Kraken','Eagle','Camel','Stag','Badger','Fox','Raven','Wolf','Boar'];const em=['🌿','🦑','🦅','🐪','🦌','🦡','🦊','🐦‍⬛','🐺','🐗'];let clans=[],units=[],food=[],towns=[],logs=[];function R(a,b){return a+Math.random()*(b-a)}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function log(t){logs.unshift(t);logs.length=6;$('feed').innerHTML=logs.slice(0,3).join('<br>')}function addClan(px,py){if(clans.length>=8)return;let id=clans.length,c={id,name:names[id%names.length],em:em[id%em.length],color:colors[id%colors.length],x:px??R(200,WORLD.w-200),y:py??R(160,WORLD.h-160),food:70,power:0,kills:0,war:new Set(),age:0};clans.push(c);towns.push({x:c.x,y:c.y,c:id,l:1});for(let i=0;i<12;i++)spawn(id,c.x+R(-50,50),c.y+R(-50,50));log(`${c.em} ${c.name} rises.`)}function spawn(c,x0,y0,type){if(units.length>700)return;units.push({c,x:x0,y:y0,vx:0,vy:0,hp:100,type:type|| (Math.random()<.28?'soldier':'worker'),age:0,tx:null,ty:null})}function seed(){year=0;sim=0;clans=[];units=[];towns=[];food=[];logs=[];for(let i=0;i<4;i++)addClan(320+i%2*1150,280+Math.floor(i/2)*570);for(let i=0;i<80;i++)food.push({x:R(40,WORLD.w-40),y:R(40,WORLD.h-40),n:R(5,18)});clans[0].war.add(1);clans[1].war.add(0);cam={x:WORLD.w/2,y:WORLD.h/2,z:Math.min(innerWidth/WORLD.w,innerHeight/WORLD.h)*1.15};log('Four clans wake up hungry.')}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}function world(sx,sy){return{x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y}}function update(dt){sim+=dt;year=Math.floor(sim/4);for(const c of clans){c.age+=dt;c.power=units.filter(u=>u.c===c.id).length;if(Math.random()<dt*.11&&c.food>8){spawn(c.id,c.x+R(-30,30),c.y+R(-30,30));c.food-=4}if(Math.random()<dt*(chaos?.018:.005)&&clans.length>1){let o=clans[(c.id+1+Math.floor(Math.random()*(clans.length-1)))%clans.length];c.war.add(o.id);o.war.add(c.id);log(`⚔️ ${c.name} declares war on ${o.name}.`)}}
for(let i=food.length-1;i>=0;i--){if(food[i].n<=0)food.splice(i,1)}if(food.length<110&&Math.random()<dt*2)food.push({x:R(30,WORLD.w-30),y:R(30,WORLD.h-30),n:R(6,16)});
for(let i=units.length-1;i>=0;i--){let u=units[i],c=clans[u.c];if(!c){units.splice(i,1);continue}u.age+=dt;if(u.hp<=0||u.age>R(110,190)){units.splice(i,1);continue}let enemy=null,ed=1e9;if(c.war.size){for(let j=0;j<units.length;j++){let v=units[j];if(v===u||!c.war.has(v.c))continue;let d=(u.x-v.x)**2+(u.y-v.y)**2;if(d<ed&&d<22000){ed=d;enemy=v}}}if(enemy){let dx=enemy.x-u.x,dy=enemy.y-u.y,l=Math.hypot(dx,dy)||1;if(ed<550){if(Math.random()<dt*(u.type==='soldier'?3.2:1.4)){enemy.hp-=R(8,18);if(enemy.hp<=0){c.kills++;log(`💥 ${c.em} ${c.name} takes a scalp.`)}}}else{u.vx+=dx/l*dt*35;u.vy+=dy/l*dt*35}}else{let f=null,fd=1e9;for(const q of food){let d=(u.x-q.x)**2+(u.y-q.y)**2;if(d<fd){fd=d;f=q}}if(f&&fd<90000){let dx=f.x-u.x,dy=f.y-u.y,l=Math.hypot(dx,dy)||1;u.vx+=dx/l*dt*22;u.vy+=dy/l*dt*22;if(fd<180){f.n-=dt*2;c.food+=dt*.55}}else{u.vx+=R(-1,1)*dt*18;u.vy+=R(-1,1)*dt*18}}u.vx*=.94;u.vy*=.94;let sp=u.type==='soldier'?48:35,l=Math.hypot(u.vx,u.vy);if(l>sp){u.vx=u.vx/l*sp;u.vy=u.vy/l*sp}u.x=clamp(u.x+u.vx*dt,12,WORLD.w-12);u.y=clamp(u.y+u.vy*dt,12,WORLD.h-12);if(Math.random()<dt*.0018&&D(u,c)>240){towns.push({x:u.x,y:u.y,c:u.c,l:1});c.x=(c.x*4+u.x)/5;c.y=(c.y*4+u.y)/5;log(`🏠 ${c.name} pushes the frontier.`)}}
if(chaos&&Math.random()<dt*.035){let q={x:R(100,WORLD.w-100),y:R(100,WORLD.h-100)};meteor(q.x,q.y,false)}if(Math.random()<dt*.012){let a=clans[Math.floor(Math.random()*clans.length)],b=clans[Math.floor(Math.random()*clans.length)];if(a&&b&&a!==b&&!a.war.has(b.id)&&Math.random()<.45){a.war.add(b.id);b.war.add(a.id);log(`🗡️ Old grudges: ${a.name} vs ${b.name}.`)}}}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#061018';x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.scale(cam.z,cam.z);x.translate(-cam.x,-cam.y);x.fillStyle='#102a27';x.fillRect(0,0,WORLD.w,WORLD.h);x.strokeStyle='#1c433d';x.lineWidth=3/cam.z;for(let i=0;i<28;i++){x.beginPath();x.moveTo(0,i*43+Math.sin(i)*17);x.lineTo(WORLD.w,i*43+Math.cos(i)*22);x.stroke()}for(const q of food){x.fillStyle='#d9b64a';x.beginPath();x.arc(q.x,q.y,3.5/cam.z**.15,0,7);x.fill()}for(const t of towns){let c=clans[t.c];if(!c)continue;x.fillStyle=c.color;x.globalAlpha=.22;x.beginPath();x.arc(t.x,t.y,55,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#0b1117';x.strokeStyle=c.color;x.lineWidth=3/cam.z;x.fillRect(t.x-9,t.y-9,18,18);x.strokeRect(t.x-9,t.y-9,18,18)}for(const u of units){let c=clans[u.c];if(!c)continue;x.fillStyle=c.color;x.beginPath();x.arc(u.x,u.y,u.type==='soldier'?5:4,0,7);x.fill();if(u.type==='soldier'){x.strokeStyle='#fff';x.globalAlpha=.45;x.lineWidth=1/cam.z;x.stroke();x.globalAlpha=1}}for(const c of clans){x.fillStyle=c.color;x.font=`900 ${16/cam.z**.15}px -apple-system`;x.fillText(`${c.em} ${c.name}`,c.x+14,c.y-16)}x.restore();$('year').textContent='Year '+year;$('agents').textContent=units.length+' souls';renderClans()}
function renderClans(){let h='';for(const c of clans){h+=`<div class="clan"><b><i class="dot" style="background:${c.color}"></i>${c.em} ${c.name}</b><br>Population ${c.power} • Food ${Math.floor(c.food)} • Kills ${c.kills}<br>${c.war.size?'⚔️ At war with '+[...c.war].map(i=>clans[i]?.name).filter(Boolean).join(', '):'🟰 No active war'}</div>`}$('clans').innerHTML=h}
function meteor(mx,my,say=true){let killed=0;for(const u of units){let d=Math.hypot(u.x-mx,u.y-my);if(d<150){u.hp-=Math.max(0,130-d);if(u.hp<=0)killed++}}if(say)log(`☄️ You dropped a meteor. ${killed?'Carnage.':'Missed everybody.'}`)}function tap(sx,sy){let p=world(sx,sy);if(mode==='drop'){food.push({x:p.x,y:p.y,n:90});log('🍖 A suspicious mountain of snacks appears.')}else if(mode==='meteor')meteor(p.x,p.y)}
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,m:false}});C.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.m=true;cam.x-=dx/cam.z;cam.y-=dy/cam.z;drag.x=e.clientX;drag.y=e.clientY});C.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId&&!drag.m)tap(e.clientX,e.clientY);drag=null});C.addEventListener('wheel',e=>{e.preventDefault();cam.z=clamp(cam.z*Math.exp(-e.deltaY*.001),.28,2.6)},{passive:false});let touches=new Map();C.addEventListener('touchstart',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){let a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:true});C.addEventListener('touchmove',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){let a=[...touches.values()],n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)cam.z=clamp(cam.z*n/pinch,.28,2.6);pinch=n}},{passive:true});C.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinch=0},{passive:true});
function setMode(m){mode=m;$('watch').classList.toggle('on',m==='watch');$('drop').classList.toggle('on',m==='drop');$('hint').textContent=m==='drop'?'🍖 DROP MODE — tap map to feed them':m==='meteor'?'☄️ METEOR — tap a target':'👀 WATCH — drag map • pinch zoom'}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Play':'⏸ Pause'};$('watch').onclick=()=>setMode('watch');$('drop').onclick=()=>setMode('drop');$('chaos').onclick=()=>{chaos=!chaos;$('chaos').classList.toggle('on',chaos);log(chaos?'🌀 Chaos is ON. This may get stupid.':'Chaos off. Allegedly civilised again.')};$('more').onclick=()=>{$('modal').classList.add('open');renderClans()};$('close').onclick=()=>$('modal').classList.remove('open');$('addClan').onclick=()=>addClan();$('meteor').onclick=()=>{$('modal').classList.remove('open');setMode('meteor')};$('peace').onclick=()=>{for(const c of clans)c.war.clear();log('🤝 You impose an extremely suspicious peace.')};$('war').onclick=()=>{if(clans.length<2)return;let a=clans[Math.floor(Math.random()*clans.length)],b=clans[Math.floor(Math.random()*clans.length)];while(b===a)b=clans[Math.floor(Math.random()*clans.length)];a.war.add(b.id);b.war.add(a.id);log(`⚔️ You stir it: ${a.name} vs ${b.name}.`)};$('reset').onclick=()=>{seed();$('modal').classList.remove('open')};addEventListener('resize',resize);function frame(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)update(dt);draw();requestAnimationFrame(frame)}resize();seed();requestAnimationFrame(frame)})();
</script></body></html>
