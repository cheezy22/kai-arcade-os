<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MU Mayhem</title><style>*{box-sizing:border-box}body{margin:0;background:#07100d;color:#fff;font-family:system-ui;text-align:center;padding:40px 16px}button{font-size:22px;font-weight:900;padding:20px 28px;border:0;border-radius:18px;background:#9cff8d;color:#07100d}.job{margin:12px auto;padding:18px;max-width:430px;border:1px solid #345;border-radius:16px;background:#102019;text-align:left}.bad{border-color:#ff5577}.stage{color:#7eefff;font-weight:900}.small{opacity:.65;font-size:13px}</style><h1>⚡🔥💧 MULTI UTILITY MAYHEM</h1><div id="start"><p>Chase the job cards. Clear blockers. Get them invoiced before the board collapses.</p><button type="button" id="go">OPEN THE JOB BOARD</button></div><main id="game" hidden><h2>Cash <span id="cash">£0</span> · Rep <span id="rep">100</span></h2><div id="jobs"></div></main><script>const stages=['ENQUIRY','DESIGN','APPROVAL','BUILD','TEST','INVOICE'];const blocks=['POC DATA','DESIGN COMMENT','SIGNED APPROVAL','RAMS','PERMIT','MATERIALS','TEST CERT','SIGNED JOB CARD','INVOICE BACKUP'];let cash=0,rep=100,jobs=[];const q=x=>document.getElementById(x);function add(){jobs.push({id:'MU-'+Math.floor(100+Math.random()*900),u:['⚡ ELEC','🔥 GAS','💧 WATER'][Math.floor(Math.random()*3)],s:0,b:Math.random()<.55?blocks[Math.floor(Math.random()*blocks.length)]:null,v:1000+Math.floor(Math.random()*3000)})}function render(){q('cash').textContent='£'+cash.toLocaleString();q('rep').textContent=rep;q('jobs').innerHTML='';jobs.forEach((j,i)=>{let d=document.createElement('button');d.type='button';d.className='job '+(j.b?'bad':'');d.innerHTML='<b>'+j.u+' · '+j.id+'</b><br><span class="stage">'+stages[j.s]+'</span><br><span class="small">'+(j.b?'⚠ '+j.b+' — tap to fix':'Tap to advance · £'+j.v.toLocaleString())+'</span>';d.onclick=()=>act(i);q('jobs').appendChild(d)})}function act(i){let j=jobs[i];if(j.b){j.b=null;rep=Math.min(100,rep+1)}else{j.s++;if(j.s>=stages.length){cash+=j.v;jobs.splice(i,1);add()}else if(Math.random()<.48)j.b=blocks[Math.floor(Math.random()*blocks.length)]}render()}function begin(){q('start').hidden=true;q('game').hidden=false;cash=0;rep=100;jobs=[];for(let i=0;i<5;i++)add();render()}q('go').addEventListener('click',begin);q('go').addEventListener('touchend',e=>{e.preventDefault();begin()},{passive:false});</script>
