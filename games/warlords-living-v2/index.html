acks':people.filter(q=>q.c===c.id&&q.hp<60).length>3?'hospital':Math.random()<.45?'tower':'farm';addB(c.id,g.x,g.y,type);c.wood-=16;c.stone-=5;say(`🏗️ ${c.name} builds a ${type}.`);p.goal=null}else steer(p,g.x,g.y,55,dt)}else if(g.type==='heal'){let d=D(p,g.target);if(d<24){p.hp=Math.min(100,p.hp+dt*22);if(p.hp>90)p.goal=null}else steer(p,g.target.x,g.target.y,60,dt)}else{let d=Math.hypot(p.x-g.x,p.y-g.y);d<20?p.goal=null:steer(p,g.x,g.y,45,dt)}let max=p.role==='scout'?76:p.role==='raider'?70:p.role==='guard'?62:52,l=Math.hypot(p.vx,p.vy);if(l>max){p.vx=p.vx/l*max;p.vy=p.vy/l*max}p.vx*=.9;p.vy*=.9;p.x=clamp(p.x+p.vx*dt,8,WORLD.w-8);p.y=clamp(p.y+p.vy*dt,8,WORLD.h-8)}function clanTick(c,dt){let live=people.filter(p=>p.c===c.id&&p.alive),own=build.filter(b=>b.c===c.id&&b.hp>0),farms=own.filter(b=>b.type==='farm'),barr=own.filter(b=>b.type==='barracks'),hosp=own.filter(b=>b.type==='hospital'),tower=own.filter(b=>b.type==='tower');c.food+=farms.reduce((n,b)=>n+b.level,0)*dt*.48;c.food-=live.length*dt*.045;c.morale=clamp(c.morale+dt*(c.food>25?.18:-.85)+hosp.length*dt*.02,0,100);c.rage=clamp(c.rage+dt*(c.trait==='vengeful'?.12:-.02)-tower.length*dt*.004,0,100);for(const b of own){b.work+=dt;if(b.work>42&&b.level<3&&c.wood>24&&c.stone>12){b.level++;b.work=0;b.max+=65;b.hp=b.max;c.wood-=24;c.stone-=12;say(`🏗️ ${c.name} upgrades a ${b.type} to level ${b.level}.`)}}if(c.food>38&&live.length<100&&Math.random()<dt*(.14+farms.length*.035)){let role=Math.random()<Math.min(.55,.16+barr.length*.06)?'guard':pick(ROLES);spawn(c.id,c.home.x+R(-80,80),c.home.y+R(-80,80),role);c.food-=7}c.buildClock-=dt;if(c.buildClock<0){c.buildClock=R(8,15);let o=pick(clans.filter(q=>q!==c)),g=c.grudge[o.id]||0;if(c.war.has(o.id)){if(c.morale<32||Math.random()<.1){setWar(c.id,o.id,false);say(`🤝 ${c.name} and ${o.name} accept an uneasy peace.`)}}else if(g>22||c.rage>75||c.trait==='chaotic'&&Math.random()<.28)setWar(c.id,o.id,true,g>22?'a remembered betrayal':'terrible judgement');else if(g<5&&Math.ran ();x.moveTo(-14,-19);x.lineTo(0,-28);x.lineTo(14,-19);x.closePath();x.fill()}if(b.hp<b.max*.75){x.fillStyle='#241d18';x.fillRect(-15,18,30,3);x.fillStyle=b.hp<b.max*.35?'#ff5f55':'#ffd15d';x.fillRect(-15,18,30*clamp(b.hp/b.max,0,1),3)}x.restore()}function person(p){let c=clans[p.c],step=Math.sin(t*8+p.x*.04)*2;x.save();x.translate(p.x,p.y);x.strokeStyle='#101711';x.lineWidth=1.5/cam.z;x.fillStyle=c.color;x.beginPath();x.arc(0,-6,3.4,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(0,-2);x.lineTo(0,7);x.moveTo(0,1);x.lineTo(-5,4+step);x.moveTo(0,1);x.lineTo(5,4-step);x.moveTo(0,7);x.lineTo(-4,13-step);x.moveTo(0,7);x.lineTo(4,13+step);x.stroke();if(['guard','raider','leader'].includes(p.role)){x.strokeStyle='#edf0e8';x.beginPath();x.moveTo(5,1);x.lineTo(9,-5);x.stroke()}if(p.role==='builder'){x.fillStyle='#f0b748';x.fillRect(-5,-10,10,2)}if(p.role==='medic'){x.fillStyle='#fff';x.fillRect(5,-8,6,6);x.fillStyle='#d94a4a';x.fillRect(7,-8,2,6);x.fillRect(5,-6,6,2)}if(p.role==='scout'){x.strokeStyle='#dff5ff';x.beginPath();x.arc(6,-6,3,0,7);x.stroke()}if(p.role==='leader'||p.fame>8){x.strokeStyle='#ffe07b';x.beginPath();x.arc(0,1,12,0,7);x.stroke()}x.restore()}function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#17261e';x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.scale(cam.z,cam.z);x.translate(-cam.x,-cam.y);x.drawImage(terrain,0,0);for(const c of clans){x.globalAlpha=.075;x.fillStyle=c.color;for(const b of build.filter(q=>q.c===c.id)){x.beginPath();x.arc(b.x,b.y,b.type==='castle'?170:105,0,7);x.fill()}}x.globalAlpha=1;road();for(const r of res)drawResource(r);for(const b of build)building(b);for(const p of people)person(p);for(const b of battles){x.globalAlpha=b.life/b.max*.6;x.strokeStyle='#fff';x.lineWidth=3/cam.z;x.beginPath();x.arc(b.x,b.y,24+(b.max-b.life)*10,0,7);x.stroke()}x.globalAlpha=1;for(const f of fx){x.globalAlpha=f.life/f.max;x.fillStyle=f.color;x.beginPath();x.arc(f.x,f.y,3,0,7);x.fill()}x.globalAlpha=1;for(const c of clans){x.fillStyle=c.color;x.font=`950 ${16/cam.z**.12}px system-ui`;x.fillText(`${c.em} ${c.name}`,c.home.x+22,c.home.y-25)}x.restore();$('year').textContent='Y'+year;$('pop').textContent=people.length+' souls';$('wars').textContent=Math.floor(clans.reduce((n,c)=>n+c.war.size,0)/2)+' wars';cards()}function cards(){if(!$('panel').classList.contains('open'))return;$('cards').innerHTML=clans.map(c=>{let ps=people.filter(p=>p.c===c.id),bs=build.filter(b=>b.c===c.id),hero=[...ps].sort((a,b)=>b.fame-a.fame)[0];return `<div class="card"><b style="color:${c.color}">${c.em} ${c.name}</b> — ${c.trait}<br>People ${ps.length} • Food ${Math.floor(c.food)} • Wood ${Math.floor(c.wood)} • Stone ${Math.floor(c.stone)}<br>🏠 ${bs.length} buildings • Morale ${Math.floor(c.morale)}${c.war.size?`<br>⚔️ War: ${[...c.war].map(i=>clans[i]?.name).join(', ')}`:''}${hero&&hero.fame>4?`<br>⭐ ${hero.name} (${Math.floor(hero.fame)})`:''}</div>`}).join('')}function fit(){cam.tx=cam.x=WORLD.w/2;cam.ty=cam.y=WORLD.h/2;cam.tz=cam.z=Math.min(W/WORLD.w,H/WORLD.h)*.96}function point(sx,sy){return{x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y}}function meteor(px,py){let k=0;for(const p of people){let d=Math.hypot(p.x-px,p.y-py);if(d<150){p.hp-=Math.max(0,160-d);if(p.hp<=0){p.alive=false;k++}}}for(const b of build){let d=Math.hypot(b.x-px,b.y-py);if(d<130)b.hp-=Math.max(0,150-d)}burst(px,py,'#ff9145');say(`☄️ Meteor strike. ${k} souls deleted.`,true)}function rebellion(){let c=pick(clans),id=clans.length;if(id>=COL.length)return say('Too many factions already.');let folk=people.filter(p=>p.c===c.id);if(folk.length<9)return;clan(id,clamp(c.home.x+R(-220,220),100,WORLD.w-100),clamp(c.home.y+R(-220,220),100,WORLD.h-100));for(let i=0;i<Math.min(7,folk.length);i++)folk[i].c=id;setWar(id,c.id,true,'civil war');say(`🔥 ${N[id]} rebels split from ${c.name}.`,true)}function hero(){let c=pick(clans),p=spawn(c.id,c.home.x+R(-40,40),c.home.y+R(-40,40),'guard');p.name='Sir '+personName();p.hp=170;p.fame=12;say(`👑 ${p.name} rises for ${c.name}.`,true)}function save(){localStorage.setItem('wos-living-v2',JSON.stringify({clans:clans.map(c=>({...c,war:[...c.war],allies:[...c.allies],leader:null})),people,res,build,history,t,year,cam}));say('💾 World saved.')}function load(){let raw=localStorage.getItem('wos-living-v2');if(!raw)return say('No save yet.');try{let d=JSON.parse(raw);clans=d.clans.map(c=>({...c,war:new Set(c.war),allies:new Set(c.allies)}));people=d.people;res=d.res;build=d.build;history=d.history;t=d.t;year=d.year;cam=d.cam;makeTerrain();say('📂 History resumes.')}catch(e){say('Save failed to load.')}}C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,m:false};director=false;$('director').classList.remove('on')});C.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.m=true;cam.x-=dx/cam.z;cam.y-=dy/cam.z;cam.tx=cam.x;cam.ty=cam.y;drag.x=e.clientX;drag.y=e.clientY});C.addEventListener('pointerup',e=>{if(drag&&!drag.m){let p=point(e.clientX,e.clientY);if(mode==='food'){res.push({x:p.x,y:p.y,kind:'food',n:100});say('🍞 A divine food cache lands.');mode='watch';$('food').classList.remove('on')}else if(mode==='meteor'){meteor(p.x,p.y);mode='watch'}}drag=null});C.addEventListener('touchstart',e=>{for(const q of e.changedTouches)touches.set(q.identifier,{x:q.clientX,y:q.clientY});if(touches.size===2){let a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:true});C.addEventListener('touchmove',e=>{for(const q of e.changedTouches)touches.set(q.identifier,{x:q.clientX,y:q.clientY});if(touches.size===2){let a=[...touches.values()],n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){cam.z=clamp(cam.z*n/pinch,.25,2.4);cam.tz=cam.z}pinch=n}},{passive:true});C.addEventListener('touchend',e=>{for(const q of e.changedTouches)touches.delete(q.identifier);if(touches.size<2)pinch=0},{passive:true});$('pause').onclick=()=>{paused=
