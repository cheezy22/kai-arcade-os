<script>(()=>{'use strict';const C=document.getElementById('world'),ctx=C.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2),last=performance.now(),paused=false,mode='watch',director=true,chaos=false,simSpeed=1,maxSpeed=false;const WORLD={w:2100,h:1300},CELL=55,COLS=Math.ceil(WORLD.w/CELL),ROWS=Math.ceil(WORLD.h/CELL);const COLORS=['#1f8cff','#ff405c','#33c96b','#ffc23f','#9b63ff','#ff8b38','#22c8c4','#ef6fbe'];const NAMES=['Thistle','Kraken','Eagle','Camel','Stag','Badger','Fox','Raven'],EM=['🌿','🦑','🦅','🐪','🦌','🦡','🦊','🐦‍⬛'];const ROLES=['worker','builder','guard','raider','medic','scout'],ROLEICON={worker:'F',builder:'B',guard:'G',raider:'R',medic:'+',scout:'S',leader:'★',heavy:'H'};const PERSONAL=['bold','cautious','greedy','vengeful','builder','chaotic'];let clans=[],agents=[],buildings=[],resources=[],fx=[],battles=[],history=[],year=0,clock=0,selected=null,headlineTimer=0,terrainCanvas=null,cam={x:WORLD.w/2,y:WORLD.h/2,z:.55,tx:WORLD.w/2,ty:WORLD.h/2,tz:.55},drag=null,touches=new Map(),pinch=0;const R=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),pick=a=>a[ri(0,a.length-1)];function say(msg,big=false){history.unshift({y:year,msg});history.length=70;$('feed').innerHTML=history.slice(0,3).map(h=>`<b>Y${h.y}</b> ${h.msg}`).join('<br>');if(big){$('headline').textContent=msg;$('headline').classList.add('on');headlineTimer=3.2}}function namePerson(){return pick(['Rab','Mags','Tam','Moira','Barry','Agnes','Gav','Soup','Pickle','Nugget','Cheddar','Frankie'])+' '+pick(['McNibble','Crunch','Batter','Crisp','Dip','Snack','Broon','McCrumb'])}function cellIndex(x,y){return clamp(Math.floor(y/CELL),0,ROWS-1)*COLS+clamp(Math.floor(x/CELL),0,COLS-1)}function spawnAgent(c,x,y,role){let a={id:crypto?.randomUUID?.()||Math.random(),c,x,y,vx:0,vy:0,role:role||pick(ROLES),hp:100,age:0,hunger:R(20,55),morale:R(55,90),fame:0,name:namePerson(),goal:null,think:R(0,2),memory:{killer:null,home:c},alive:true};agents.push(a);return a}function addBuilding(c,x,y,type='camp'){let hp=type==='castle'?420:type==='watchtower'?220:180;buildings.push({c,x,y,type,hp,maxHp:hp,level:1,age:0,work:0})}function createClan(i,x,y){let c={id:i,name:NAMES[i],em:EM[i],color:COLORS[i],home:{x,y},food:110,wood:80,stone:55,morale:R(60,85),rage:R(5,25),wealth:R(20,60),trait:PERSONAL[i%PERSONAL.length],war:new Set(),allies:new Set(),relations:{},kills:0,deaths:0,territory:0,leader:null,hero:null,grudge:{},buildClock:R(5,12),dipClock:R(5,14)};clans.push(c);addBuilding(i,x,y,'castle');addBuilding(i,x+R(-70,70),y+R(-70,70),'farm');for(let n=0;n<18;n++)spawnAgent(i,x+R(-95,95),y+R(-95,95));c.leader=spawnAgent(i,x+R(-25,25),y+R(-25,25),'leader');c.leader.name='Chief '+c.leader.name;return c}function buildTerrain(){terrainCanvas=document.createElement('canvas'); terrainCanvas.width=WORLD.w; terrainCanvas.height=WORLD.h; const g=terrainCanvas.getContext('2d');const sky=g.createLinearGradient(0,0,0,WORLD.h); sky.addColorStop(0,'#314e3c'); sky.addColorStop(.5,'#3d6045'); sky.addColorStop(1,'#2e4d39'); g.fillStyle=sky; g.fillRect(0,0,WORLD.w,WORLD.h);for(let i=0;i<46;i++){const x=R(-80,WORLD.w+80),y=R(-80,WORLD.h+80),rx=R(90,260),ry=R(55,170);g.save();g.translate(x,y);g.rotate(R(-.45,.45));g.fillStyle=i%4===0?'rgba(92,110,67,.22)':i%3===0?'rgba(55,83,59,.27)':'rgba(121,137,77,.12)';g.beginPath();g.ellipse(0,0,rx,ry,0,0,7);g.fill();g.restore()}for(let r=0;r<2;r++){let sy=R(180,WORLD.h-180);g.lineCap='round';g.lineJoin='round';g.strokeStyle='rgba(20,38,34,.42)';g.lineWidth=34;g.beginPath();g.moveTo(-40,sy);for(let x=0;x<=WORLD.w+100;x+=180)g.lineTo(x,sy+Math.sin(x*.004+r*2)*R(55,95)+Math.sin(x*.011)*22);g.stroke();g.strokeStyle='#315c69';g.lineWidth=22;g.stroke();g.strokeStyle='rgba(164,211,218,.28)';g.lineWidth=3;g.stroke()}g.setLineDash([16,14]);g.strokeStyle='rgba(187,167,116,.34)';g.lineWidth=9;for(let i=0;i<6;i++){let y=R(90,WORLD.h-90);g.beginPath();g.moveTo(R(-100,120),y);g.bezierCurveTo(WORLD.w*.35,R(0,WORLD.h),WORLD.w*.7,R(0,WORLD.h),WORLD.w+100,R(0,WORLD.h));g.stroke()}g.setLineDash([]);for(let i=0;i<250;i++){let x=R(15,WORLD.w-15),y=R(15,WORLD.h-15);if(Math.random()<.78){g.fillStyle='rgba(20,55,34,.7)';g.beginPath();g.arc(x,y,R(3,7),0,7);g.fill();g.fillStyle='rgba(59,103,55,.7)';g.beginPath();g.arc(x-2,y-2,R(2,5),0,7);g.fill()}else{g.fillStyle='rgba(120,125,117,.55)';g.beginPath();g.ellipse(x,y,R(3,8),R(2,5),R(0,3),0,7);g.fill()}}const v=g.createRadialGradient(WORLD.w/2,WORLD.h/2,250,WORLD.w/2,WORLD.h/2,1200);v.addColorStop(0,'rgba(255,255,255,.02)');v.addColorStop(1,'rgba(0,0,0,.22)');g.fillStyle=v;g.fillRect(0,0,WORLD.w,WORLD.h)}function newWorld(){clans=[];agents=[];buildings=[];resources=[];fx=[];battles=[];history=[];year=0;clock=0;buildTerrain();const pts=[[330,280],[1770,280],[330,1020],[1770,1020]];pts.forEach((p,i)=>createClan(i,p[0],p[1]));for(let i=0;i<150;i++)resources.push({x:R(50,WORLD.w-50),y:R(50,WORLD.h-50),kind:Math.random()<.7?'food':Math.random()<.5?'wood':'stone',n:R(8,28)});setWar(0,1,true,'old border feud');fit();say('Four snack kingdoms wake up hungry.',true)}function fit(){cam.tx=WORLD.w/2;cam.ty=WORLD.h/2;cam.tz=clamp(Math.min(W/WORLD.w,H/WORLD.h)*.96,.42,1.15);cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz}function setWar(a,b,on,cause='grudge'){let A=clans[a],B=clans[b];if(!A||!B||a===b)return;if(on){if(!A.war.has(b)){A.war.add(b);B.war.add(a);A.allies.delete(b);B.allies.delete(a);A.grudge[b]=(A.grudge[b]||0)+15;B.grudge[a]=(B.grudge[a]||0)+15;say(`⚔️ ${A.name} and ${B.name} go to war — ${cause}.`,true)}}else{A.war.delete(b);B.war.delete(a)}}function nearestEnemy(a,range=260){let Cc=clans[a.c],best=null,bd=range*range;for(const o of agents){if(!o.alive||o.c===a.c||!Cc.war.has(o.c))continue;let dx=o.x-a.x,dy=o.y-a.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o}}return best}function nearestResource(a,kind){let best=null,bd=320*320;for(const r of resources) dom()<.08)a.hp-=R(4,18)}say('🌪 A divine storm scatters armies and civilians alike.',true)}function feastWorld(){for(const c of clans)c.food+=120;for(let i=0;i<70;i++)resources.push({x:R(30,WORLD.w-30),y:R(30,WORLD.h-30),kind:'food',n:R(18,45)});say('🍗 The heavens open. Every clan receives an absurd feast.',true)}function growWood(){for(let i=0;i<90;i++)resources.push({x:R(30,WORLD.w-30),y:R(30,WORLD.h-30),kind:'wood',n:R(14,38)});say('🌲 Forests surge across the world overnight.',true)}function blessWeakest(){let c=clans.slice().sort((a,b)=>a.territory-b.territory)[0];if(!c)return;c.food+=100;c.wood+=70;c.stone+=45;c.morale=100;for(let i=0;i<5;i++)spawnAgent(c.id,c.home.x+R(-55,55),c.home.y+R(-55,55),i<2?'guard':'worker');say(`✨ ${c.name}, currently getting pumped, receives divine favour.`,true)}function curseLeader(){let c=clans.slice().sort((a,b)=>b.territory-a.territory)[0];if(!c)return;c.morale=Math.max(10,c.morale-35);c.rage=Math.min(100,c.rage+25);if(c.leader&&c.leader.alive)c.leader.hp=Math.max(12,c.leader.hp-55);say(`☠️ ${c.name}'s leading dynasty is cursed. Morale collapses.`,true)}function worldPoint(sx,sy){return{x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y}}function godTap(sx,sy){let p=worldPoint(sx,sy);if(mode==='bless'){resources.push({x:p.x,y:p.y,kind:'food',n:100});say('🍖 A divine snack mountain crashes into history.');burst(p.x,p.y,'#ffd45e');mode='watch';$('bless').classList.remove('on')}else if(mode==='meteor'){meteor(p.x,p.y);mode='watch'}else if(mode==='lightning'){lightning(p.x,p.y);mode='watch'}}function burst(x,y,color){for(let i=0;i<18;i++)fx.push({x,y,vx:R(-80,80),vy:R(-85,30),life:R(.5,1),max:1,text:'•',color})}function meteor(x,y){let k=0;for(const a of agents){let d=Math.hypot(a.x-x,a.y-y);if(d<145){a.hp-=Math.max(0,150-d);if(a.hp<=0){a.alive=false;k++}}}for(const b of buildings){let d=Math.hypot(b.x-x,b.y-y);if(d<120)b.hp-=Math.max(0,130-d)}burst(x,y,'#ff9b45');say(`☄️ Meteor strike. ${k} souls removed from the snack timeline.`,true)}function rebellion(){let big=clans.slice().sort((a,b)=>b.territory-a.territory)[0];if(!big)return;let id=clans.length;if(id>=COLORS.length)return say('🔥 The world is already too factionalised.');let a=agents.filter(x=>x.c===big.id&&x.alive);if(a.length<8)return;say(`🔥 Rebels split from ${big.name}!`,true);let n=createClan(id,big.home.x+R(-220,220),big.home.y+R(-220,220));for(let i=0;i<Math.min(8,a.length);i++)a[i].c=id;setWar(id,big.id,true,'a civil war')}function makeHero(){let c=pick(clans),a=spawnAgent(c.id,c.home.x+R(-50,50),c.home.y+R(-50,50),'heavy');a.name='Sir '+namePerson();a.hp=180;a.morale=100;a.fame=12;c.hero=a;say(`👑 ${a.name} rises for ${c.name}.`,true)}function save(){let data={clans:clans.map(c=>({...c,war:[...c.war],allies:[...c.allies],leader:null,hero:null})),agents,buildings,resources,history,year,clock,cam};localStorage.setItem('wos-living-world',JSON.stringify(data));say('💾 World saved.')}function load(){let raw=localStorage.getItem('wos-living-world');if(!raw)return say('No saved world yet.');try{let d=JSON.parse(raw);clans=d.clans.map(c=>({...c,war:new Set(c.war),allies:new Set(c.allies)}));agents=d.agents;buildings=d.buildings;resources=d.resources;history=d.history;year=d.year;clock=d.clock;cam=d.cam;for(const c of clans)c.leader=agents.find(a=>a.c===c.id&&a.role==='leader'&&a.alive)||null;say('📂 History resumes.')}catch(e){say('Save corrupted. The archives blame crisps.')}}const pointers=new Map();let pinchState=null;function clampCamera(){let halfW=W/(2*cam.z),halfH=H/(2*cam.z);if(halfW>=WORLD.w/2)cam.x=WORLD.w/2;else cam.x=clamp(cam.x,halfW,WORLD.w-halfW);if(halfH>=WORLD.h/2)cam.y=WORLD.h/2;else cam.y=clamp(cam.y,halfH,WORLD.h-halfH);cam.tx=cam.x;cam.ty=cam.y}C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false});director=false;$('director').classList.remove('on');if(pointers.size===2){let a=[...pointers.values()],cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;pinchState={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:cam.z,anchor:worldPoint(cx,cy),cx,cy}}});C.addEventListener('pointermove',e=>{let p=pointers.get(e.pointerId);if(!p)return;let ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;if(Math.hypot(p.x-p.sx,p.y-p.sy)>4)p.moved=true;if(pointers.size>=2){let a=[...pointers.values()].slice(0,2),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(!pinchState||pinchState.dist<5)pinchState={dist,z:cam.z,anchor:worldPoint(cx,cy),cx,cy};let nz=clamp(pinchState.z*(dist/pinchState.dist),.42,2.7);cam.z=nz;cam.tz=nz;cam.x=pinchState.anchor.x-(cx-W/2)/nz;cam.y=pinchState.anchor.y-(cy-H/2)/nz;clampCamera();return}let dx=p.x-ox,dy=p.y-oy;if(Math.hypot(dx,dy)>0){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCamera()}});function endPointer(e){let p=pointers.get(e.pointerId);if(pointers.size===1&&p&&!p.moved)godTap(e.clientX,e.clientY);pointers.delete(e.pointerId);if(pointers.size<2)pinchState=null}C.addEventListener('pointerup',endPointer);C.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinchState=null});function setSpeed(v){maxSpeed=v==='max';simSpeed=maxSpeed?1:Number(v);document.querySelectorAll('#speedDock button').forEach(b=>b.classList.toggle('on',b.dataset.speed===String(v)));$('speedRead').textContent=maxSpeed?'MAX':simSpeed+'×';say(maxSpeed?'🚀 MAX speed — phone-limited simulation.':'⏩ Simulation speed '+simSpeed+'×.')}document.querySelectorAll('#speedDock button').forEach(b=>b.onclick=()=>setSpeed(b.dataset.speed));$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Play':'⏸ Pause'};$('director').onclick=()=>{director=!director;$('director').classList.toggle('on',director);if(director)say('🎥 Director is hunting for stories.')};$('bless').onclick=()=>{mode=mode==='bless'?'watch':'bless';$('bless').classList.toggle('on',mode==='bless');$('focus').textContent=mode==='bless'?'🍖 BLESS MODE • tap map':'👁 WATCH • one finger drag • two finger zoom'};$('chaos').onclick=()=>{chaos=!chaos;$('chaos').classList.toggle('on',chaos);say(chaos?'🌀 Chaos mode armed. History is now drunk.':'Chaos calmed down.')};$('more').onclick=()=>{$('modal').classList.add('open');renderCards()};$('close').onclick=()=>$('modal').classList.remove('open');$('meteor').onclick=()=>{$('modal').classList.remove('open');mode='meteor';$('focus').textContent='☄️ METEOR • tap target'};$('lightning').onclick=()=>{$('modal').classList.remove('open');mode='lightning';$('focus').textContent='⚡ LIGHTNING • tap target'};$('quake').onclick=()=>{quake();renderCards()};$('storm').onclick=()=>{divineStorm();renderCards()};$('feast').onclick=()=>{feastWorld();renderCards()};$('forest').onclick=()=>{growWood();renderCards()};$('blessClan').onclick=()=>{blessWeakest();renderCards()};$('curseClan').onclick=()=>{curseLeader();renderCards()};$('rebellion').onclick=()=>{rebellion();renderCards()};$('forcedWar').onclick=()=>{let a=pick(clans),b=pick(clans.filter(x=>x!==a));setWar(a.id,b.id,true,'divine interference');renderCards()};$('peace').onclick=()=>{for(const c of clans)c.war.clear();say('🤝 An extremely suspicious world peace begins.',true);renderCards()};$('hero').onclick=()=>{makeHero();renderCards()};$('save').onclick=save;$('load').onclick=()=>{load();renderCards()};$('newWorld').onclick=()=>{newWorld();$('modal').classList.remove('open')};function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px'}addEventListener('resize',resize);function frame(now){let realDt=Math.min(.05,(now-last)/1000);last=now;if(!paused){if(maxSpeed){const start=performance.now(),budget=12,step=.18;let guard=0;while(performance.now()-start<budget&&guard<260){update(step);guard++}}else{let remain=realDt*simSpeed;const step=simSpeed<=8?.04:simSpeed<=50?.07:simSpeed<=100?.10:simSpeed<=500?.16:.20;let guard=0;while(remain>0&&guard<180){const d=Math.min(step,remain);update(d);remain-=d;guard++}}}draw();requestAnimationFrame(frame)}resize();newWorld();requestAnimationFrame(frame);})();</script></body></html>
