;autoSaveClock+=realDt;if(autoSaveClock>=2){autoSaveClock=0;persist(true)}draw();requestAnimationFrame(frame)}addEventListener('pagehide',()=>persist(true));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist(true)});resize();let resumed=false;try{const raw=localStorage.getItem(SAVE_KEY);if(raw)resumed=restore(raw,true)}catch(e){}if(!resumed)newWorld();else say('📂 Auto-resumed where you left off.',true);requestAnimationFrame(frame);");const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('sim script missing');new Function(m[1]);document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').innerHTML='V6 LOAD ERROR<small class="err">'+String(e&&e.stack||e)+'</small>'}})()</script></body></html>
