<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Touchline Empire V6</title><style>*{box-sizing:border-box}body{margin:0;background:#090d14;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 10px calc(82px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #283248}.top b{font-size:18px}.sub{font-size:11px;color:#9aa7bc}.card{background:#141b28;border:1px solid #303a50;border-radius:16px;padding:12px;margin:12px 0}.score{text-align:center;font-size:46px;font-weight:900}.teams{text-align:center;color:#aab5c8;font-weight:700;font-size:14px}.pitch{position:relative;width:100%;aspect-ratio:1.55;background:repeating-linear-gradient(90deg,#2e7049 0 12.5%,#296744 12.5% 25%);border:2px solid #d5eadb;border-radius:8px;margin-top:10px;overflow:visible}.line{position:absolute;border-color:#d9eadf;border-style:solid;pointer-events:none}.half{left:50%;top:0;bottom:0;border-width:0 0 0 1px}.circle{left:42%;top:32%;width:16%;height:36%;border-width:1px;border-radius:50%}.spot{left:50%;top:50%;width:4px;height:4px;background:white;border-radius:50%;transform:translate(-50%,-50%)}.box{top:20%;width:16%;height:60%;border-width:1px}.box.l{left:0}.box.r{right:0}.six{top:35%;width:6%;height:30%;border-width:1px}.six.l{left:0}.six.r{right:0}.goal{position:absolute;top:40%;height:20%;width:3.5%;border:2px solid white;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff44 4px 5px),repeating-linear-gradient(90deg,transparent 0 4px,#ffffff44 4px 5px)}.goal.l{left:-3.5%}.goal.r{right:-3.5%}.p{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);transition:left .1s linear,top .1s linear;border:1px solid #fff9;z-index:5}.blue{background:#6ea7ff}.red{background:#ff7483}.gk{outline:2px solid #ffd45d}.ref{background:#111;outline:1px solid #ffe46a;width:10px;height:10px}.ball{position:absolute;width:7px;height:7px;border-radius:50%;background:white;transform:translate(-50%,-50%);z-index:9;box-shadow:0 1px 4px #000}.clock{text-align:center;font-weight:900;margin:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.stat{background:#101622;border-radius:9px;padding:7px;text-align:center;font-size:10px;color:#a8b4c8}.stat b{display:block;font-size:16px;color:white}.comment{max-height:170px;overflow:auto;margin-top:8px}.event{padding:7px 0;border-bottom:1px solid #2b3549;font-size:12px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}button{background:#263147;color:white;border:1px solid #40506d;border-radius:10px;padding:9px;font-weight:800}.sel{background:#4a6488}.bottom{position:fixed;left:0;right:0;bottom:0;background:#0c111a;border-top:1px solid #2b3549;padding:7px 10px calc(7px + env(safe-area-inset-bottom));text-align:center;color:#9eabc0;font-size:10px}</style></head><body><div class=top><div><b>⚽ TOUCHLINE EMPIRE V6</b><div class=sub>Ball-first football engine</div></div><div style=text-align:right><b>Riverside Athletic</b><div class=sub>4-3-3</div></div></div><div class=card><div id=score class=score>0 — 0</div><div class=teams>Riverside Athletic v Kingsport FC</div><div id=clock class=clock>0′ · Kick-off</div><div id=pitch class=pitch><div class="line half"></div><div class="line circle"></div><div class="line spot"></div><div class="line box l"></div><div class="line box r"></div><div class="line six l"></div><div class="line six r"></div><div class="goal l"></div><div class="goal r"></div></div><div class=stats><div class=stat><b id=poss>50%</b>Poss</div><div class=stat><b id=shots>0-0</b>Shots</div><div class=stat><b id=xg>0.00-0.00</b>xG</div><div class=stat><b id=passes>0-0</b>Passes</div></div><div class=controls><button data-m=Defensive>Defend</button><button data-m=Balanced class=sel>Balanced</button><button data-m=Attacking>Attack</button></div><div id=comment class=comment></div></div><div class=bottom>Goals only count when the visible ball crosses the correct goal line between the posts.</div><script>(()=>{const pitch=document.getElementById('pitch'),scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),possEl=document.getElementById('poss'),shotsEl=document.getElementById('shots'),xgEl=document.getElementById('xg'),passesEl=document.getElementById('passes'),comment=document.getElementById('comment');const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rand=(a,b)=>a+Math.random()*(b-a);let minute=0,score=[0,0],shots=[0,0],xg=[0,0],passes=[0,0],poss=[0,0],mentality='Balanced',team=0,owner=6,phase='build',players=[],ref={x:50,y:58},ball={x:50,y:50,vx:0,vy:0,mode:'carry',target:null,shotTeam:null,lastX:50,lastY:50};const base=[[5,50,'GK'],[20,12,'LB'],[18,37,'CB'],[18,63,'CB'],[20,88,'RB'],[38,50,'DM'],[49,33,'CM'],[49,67,'CM'],[67,14,'LW'],[73,50,'ST'],[67,86,'RW']];const shapes=[base,base.map(p=>[100-p[0],p[1],p[2]])];function event(t){comment.innerHTML='<div class=event>'+t+'</div>'+comment.innerHTML}function make(){for(let t=0;t<2;t++)for(let i=0;i<11;i++){let a=shapes[t][i],el=document.createElement('div');el.className='p '+(t?'red':'blue')+(i===0?' gk':'');pitch.appendChild(el);players.push({team:t,i,role:a[2],homeX:a[0],homeY:a[1],x:a[0],y:a[1],tx:a[0],ty:a[1],el,run:0})}let r=document.createElement('div');r.className='p ref';pitch.appendChild(r);ref.el=r;let b=document.createElement('div');b.className='ball';pitch.appendChild(b);ball.el=b}function pfind(t,i){return players.find(p=>p.team===t&&p.i===i)}function nearest(t,x,y,skip=-1){let best=null,bd=999;for(const p of players){if(p.team!==t||p.i===skip)continue;let d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p}}return best}function nearestOpp(p){return nearest(1-p.team,p.x,p.y)}function openScore(p){let o=nearestOpp(p);return o?dist(p,o):20}function progression(from,to){let dir=from.team===0?1:-1;return dir*(to.x-from.x)}function setupShape(){const bx=ball.x,by=ball.y;for(const p of players){const has=p.team===team,dir=p.team===0?1:-1;let shift=clamp((bx-50)*.18,-9,9),side=(by-50)*.08;p.tx=p.homeX+shift;p.ty=p.homeY+side;if(has){if(p.role==='ST')p.tx+=dir*(phase==='attack'?14:6);if(p.role==='LW'||p.role==='RW'){p.tx+=dir*(phase==='attack'?11:5);p.ty+=(p.role==='LW'?-1:1)*(phase==='attack'?5:2)}if(p.role==='CM')p.tx+=dir*(phase==='attack'?8:3);if(p.role==='LB'||p.role==='RB')p.tx+=dir*(phase==='attack'?7:1);if(p.run>0){p.tx+=dir*16;p.ty+=rand(-7,7);p.run--}}else{p.tx-=dir*(phase==='attack'?6:2);let press=nearest(p.team,bx,by);if(press===p&&p.i!==0){p.tx=bx-dir*1.5;p.ty=by}}if(p.i===0){p.tx=p.team===0?5:95;p.ty=clamp(by,40,60)}p.tx=clamp(p.tx,3,97);p.ty=clamp(p.ty,4,96)}}function movePlayers(){setupShape();for(const p of players){let sp=p.i===0?.65:1.15,dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.1){p.x+=dx/d*Math.min(sp,d);p.y+=dy/d*Math.min(sp,d)}p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'}ref.x+=(clamp(ball.x,25,75)-ref.x)*.07;ref.y+=(clamp(ball.y+7,20,80)-ref.y)*.07;ref.el.style.left=ref.x+'%';ref.el.style.top=ref.y+'%'}function carryBall(){let o=pfind(team,owner);if(!o)return;ball.x+=(o.x-ball.x)*.8;ball.y+=(o.y-ball.y)*.8}function launch(to,kind='pass'){ball.mode=kind;ball.target=to;ball.vx=(to.x-ball.x)/6;ball.vy=(to.y-ball.y)/6}function choosePass(){const o=pfind(team,owner),dir=team===0?1:-1;let opts=players.filter(p=>p.team===team&&p.i!==owner&&p.i!==0).map(p=>{let prog=progression(o,p),open=openScore(p),lane=Math.abs(p.y-o.y),forwardBonus=prog>0?prog*1.8:prog*.7;return{p,score:forwardBonus+open*1.6-lane*.18+Math.random()*8}}).sort((a,b)=>b.score-a.score);let pick=opts[0];if(!pick)return;let t={x:clamp(pick.p.x+dir*rand(1,6),3,97),y:clamp(pick.p.y+rand(-2,2),4,96),player:pick.p};launch(t,'pass');passes[team]++}function startRun(){let candidates=players.filter(p=>p.team===team&&['ST','LW','RW','CM'].includes(p.role)&&p.i!==owner);if(candidates.length)candidates[Math.floor(Math.random()*candidates.length)].run=rand(4,8)}function dribble(){const o=pfind(team,owner),dir=team===0?1:-1,opp=nearestOpp(o);o.tx=clamp(o.x+dir*rand(7,12),3,97);if(opp&&dist(o,opp)<5){if(Math.random()<.42){team=1-team;owner=opp.i;phase='transition';event(minute+'′ 💥 '+(team===0?'Riverside':'Kingsport')+' win the tackle.')}}}function shoot(){const o=pfind(team,owner),goalX=team===0?101:-1,goalY=50+rand(-7,7),d=Math.abs(goalX-o.x),angle=Math.abs(50-o.y),chance=clamp(.55-d*.012-angle*.005,.06,.42);shots[team]++;xg[team]+=chance;ball.mode='shot';ball.shotTeam=team;ball.vx=(goalX-ball.x)/8;ball.vy=(goalY-ball.y)/8;event(minute+'′ 🎯 '+(team===0?'Riverside':'Kingsport')+' shoot!')}function decide(){let o=pfind(team,owner);if(!o||ball.mode!=='carry')return;poss[team]++;let dir=team===0?1:-1,goalDist=Math.abs((team===0?100:0)-o.x),opp=nearestOpp(o),pressure=opp&&dist(o,opp)<6;if(Math.random()<.28)startRun();if(goalDist<26&&o.i!==0){if(Math.random()<.55){shoot();return}}if(pressure){if(Math.random()<.72)choosePass();else dribble();return}let ahead=players.filter(p=>p.team===team&&p.i!==owner&&progression(o,p)>4&&openScore(p)>5);if(ahead.length&&Math.random()<.72){choosePass();return}if(['ST','LW','RW','CM'].includes(o.role)&&Math.random()<.36){dribble();return}choosePass()}function resolvePass(){let t=ball.target;if(!t)return;let intended=t.player,opp=nearest(1-team,t.x,t.y);if(opp&&Math.hypot(opp.x-t.x,opp.y-t.y)<4.5&&Math.random()<.48){team=1-team;owner=opp.i;phase='transition';event(minute+'′ 🦶 Interception.');ball.mode='carry';ball.x=opp.x;ball.y=opp.y;return}team=intended.team;owner=intended.i;phase=progression(pfind(team,owner),{x:team===0?100:0,y:50})<35?'attack':phase;ball.mode='carry';ball.x=intended.x;ball.y=intended.y}function checkGoal(){if(ball.mode!=='shot')return false;let crossedRight=ball.lastX<100&&ball.x>=100,crossedLeft=ball.lastX>0&&ball.x<=0,inMouth=ball.y>=40&&ball.y<=60;if(inMouth&&((ball.shotTeam===0&&crossedRight)||(ball.shotTeam===1&&crossedLeft))){score[ball.shotTeam]++;scoreEl.textContent=score[0]+' — '+score[1];event(minute+'′ ⚽ GOAL! The ball visibly crosses the line.');restart(1-ball.shotTeam);return true}return false}function resolveShot(){if(checkGoal())return;let gk=pfind(1-ball.shotTeam,0),nearGoal=ball.shotTeam===0?ball.x>93:ball.x<7;if(nearGoal&&Math.random()<.48){team=gk.team;owner=0;ball.mode='carry';ball.x=gk.x;ball.y=gk.y;event(minute+'′ 🧤 Saved by the goalkeeper.');phase='build';return}if((ball.x>102||ball.x<-2||ball.y<0||ball.y>100)){event(minute+'′ ↗️ Shot goes wide.');restart(1-ball.shotTeam)}}function updateBall(){ball.lastX=ball.x;ball.lastY=ball.y;if(ball.mode==='carry')carryBall();else{ball.x+=ball.vx;ball.y+=ball.vy;if(ball.mode==='pass'){let t=ball.target;if(Math.hypot(ball.x-t.x,ball.y-t.y)<2){resolvePass()}}else if(ball.mode==='shot')resolveShot()}ball.el.style.left=ball.x+'%';ball.el.style.top=ball.y+'%'}function restart(t){team=t;owner=0;phase='build';let g=pfind(team,0);ball.mode='carry';ball.shotTeam=null;ball.x=g.x;ball.y=g.y;ball.vx=ball.vy=0}function ui(){clockEl.textContent=minute+'′ · '+(phase==='attack'?'Attacking':phase==='transition'?'Transition':'Build-up');let tot=poss[0]+poss[1]||1;possEl.textContent=Math.round(poss[0]/tot*100)+'%';shotsEl.textContent=shots[0]+'-'+shots[1];xgEl.textContent=xg[0].toFixed(2)+'-'+xg[1].toFixed(2);passesEl.textContent=passes[0]+'-'+passes[1]}document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{mentality=b.dataset.m;document.querySelectorAll('button[data-m]').forEach(x=>x.classList.toggle('sel',x===b));event(minute+'′ 🧠 Riverside switch to '+mentality+'.')});function tick(){minute++;if(minute>90){clearInterval(loop);event('90′ 🏁 Full time: '+score[0]+'-'+score[1]+'.');return}if(minute%2===0)decide();for(let s=0;s<3;s++){movePlayers();updateBall()}ui()}make();restart(0);for(let i=0;i<8;i++)movePlayers();event('0′ ⚽ Kick-off. Goals now require the ball to enter the net.');let loop=setInterval(tick,180)})();</script></body></html>
