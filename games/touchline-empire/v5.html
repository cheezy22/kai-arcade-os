tton></div><div id=comment class=comment></div></div><div class=bottom>V5 spatial engine · independent ball · roles · referee · tackles · transitions · restarts</div><script>const P=document.getElementById('pitch'),C=(n,a,b)=>Math.max(a,Math.min(b,n)),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let ment='Balanced',min=0,hs=0,as=0,shots=[0,0],xg=[0,0],possTicks=[0,0],phase='build',team=0,owner=6,ball={x:50,y:50,vx:0,vy:0,free:false},players=[],ref={x:50,y:58};const A=[[5,50,'GK'],[19,15,'LB'],[18,38,'CB'],[18,62,'CB'],[19,85,'RB'],[38,50,'DM'],[48,34,'CM'],[48,66,'CM'],[67,15,'LW'],[72,50,'ST'],[67,85,'RW']],B=A.map(a=>[100-a[0],a[1],a[2]]);function mk(){for(let t=0;t<2;t++)for(let i=0;i<11;i++){let a=(t?B:A)[i],d=document.createElement('div');d.className='p '+(t?'red':'blue')+(i===0?' gk':'');P.appendChild(d);players.push({team:t,i,role:a[2],anchorX:a[0],anchorY:a[1],x:a[0],y:a[1],tx:a[0],ty:a[1],el:d})}let re=document.createElement('div');re.className='p ref';P.appendChild(re);ref.el=re;let be=document.createElement('div');be.className='ball';P.appendChild(be);ball.el=be}function buttons(){bal.className=ment==='Balanced'?'sel':'';att.className=ment==='Attacking'?'sel':'';def.className=ment==='Defensive'?'sel':''}function ev(s){comment.innerHTML='<div class=event>'+s+'</div>'+comment.innerHTML}function nearest(t,x,y,exclude=-1){let q=null,bd=1e9;players.forEach(p=>{if(p.team!==t||p.i===exclude)return;let d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;q=p}});return q}function shape(){let bx=ball.x,by=ball.y;players.forEach(p=>{let has=p.team===team,dir=p.team===0?1:-1,shift=C((bx-50)*.25,-10,10),width=(by-50)*.12;p.tx=p.anchorX+shift;p.ty=p.anchorY+width;if(has){if(['LW','RW'].includes(p.role)){p.tx+=dir*(phase==='attack'?12:5);p.ty+=(p.role==='LW'?-1:1)*4}if(p.role==='ST')p.tx+=dir*(phase==='attack'?15:7);if(p.role==='CM')p.tx+=dir*(phase==='attack'?7:3);if(p.role==='RB'||p.role==='LB')p.tx+=dir*(phase==='attack'?7:2)}else{p.tx-=dir*(phase==='attack'?7:3);let press=nearest(p.team,bx,by);if(press===p){p.tx=bx-dir*2;p.ty=by}}if(p.i===0){p.tx=p.team===0?5:95;p.ty=C(by,38,62)}p.tx=C(p.tx,3,97);p.ty=C(p.ty,4,96)})}function move(){shape();players.forEach(p=>{let speed=p.i===0?.7:1.35,dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.2){p.x+=dx/d*Math.min(speed,d);p.y+=dy/d*Math.min(speed,d)}p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'});ref.x+=(C(ball.x,25,75)-ref.x)*.08;ref.y+=(C(ball.y+8,18,82)-ref.y)*.08;ref.el.style.left=ref.x+'%';ref.el.style.top=ref.y+'%';if(ball.free){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.9;ball.vy*=.9}else{let o=players.find(p=>p.team===team&&p.i===owner);if(o){ball.x+=(o.x-ball.x)*.65;ball.y+=(o.y-ball.y)*.65}}ball.x=C(ball.x,-2,102);ball.y=C(ball.y,1,99);ball.el.style.left=ball.x+'%';ball.el.style.top=ball.y+'%'}function pass(){let o=players.find(p=>p.team===team&&p.i===owner),dir=team===0?1:-1,cands=players.filter(p=>p.team===team&&p.i!==owner).map(p=>({p,score:dir*(p.x-o.x)*1.3-Math.abs(p.y-o.y)*.18+Math.random()*14})).sort((a,b)=>b.score-a.score);let target=(Math.random()<.25?cands[R(0,Math.min(4,cands.length-1))]:cands[0]).p;ball.free=true;ball.vx=(target.x-ball.x)/4;ball.vy=(target.y-ball.y)/4;setTimeout(()=>{let opp=nearest(1-team,target.x,target.y),od=Math.hypot(opp.x-target.x,opp.y-target.y);if(od<5&&Math.random()<.38){team=1-team;owner=opp.i;phase='transition';ev(min+'′ 🦶 Interception! Possession turns over.')}else{owner=target.i;if(dir*(target.x-(team===0?50:50))>18)phase='attack'}ball.free=false},450)}function dribble(){let o=players.find(p=>p.team===team&&p.i===owner),dir=team===0?1:-1;o.tx=C(o.x+dir*10,3,97);o.ty=C(o.y+R(-6,6),4,96);let opp=nearest(1-team,o.x,o.y);if(Math.hypot(opp.x-o.x,opp.y-o.y)<5&&Math.random()<.45){if(Math.random()<.18){ev(min+'′ 📣 Foul. Referee awards a free kick.');phase='restart'}else{team=1-team;owner=opp.i;phase='transition';ev(min+'′ 💥 Tackle won cleanly.')}}}function shoot(){let o=players.find(p=>p.team===team&&p.i===owner),goalX=team===0?100:0,dist=Math.abs(goalX-o.x),ang=Math.abs(50-o.y),q=C(.42-dist*.009-ang*.004,.03,.32);shots[team]++;xg[team]+=q;ball.free=true;ball.vx=(goalX-ball.x)/3;ball.vy=(50+R(-12,12)-ball.y)/3;setTimeout(()=>{if(Math.random()<q){team===0?hs++:as++;ev(min+'′ ⚽ GOAL! A real move ends in the net.');score.textContent=hs+' — '+as}else ev(min+'′ 🧤 '+(Math.random()<.55?'Saved by the goalkeeper.':'Shot misses the target.'));restart(1-team)},350)}function restart(t){team=t;owner=0;phase='build';ball.free=false;let g=players.find(p=>p.team===team&&p.i===0);ball.x=g.x;ball.y=g.y}function decision(){let o=players.find(p=>p.team===team&&p.i===owner),goalX=team===0?100:0,dist=Math.abs(goalX-o.x);possTicks[team]++;if(phase==='restart'){restart(team);return}if(dist<30&&o.i!==0&&Math.random()<.38){shoot();return}let opp=nearest(1-team,o.x,o.y),pressure=Math.hypot(opp.x-o.x,opp.y-o.y)<7;if(pressure&&Math.random()<.38)pass();else if(['LW','RW','ST'].includes(o.role)&&Math.random()<.35)dribble();else pass()}function tick(){min++;if(min>90){clearInterval(game);ev('90′ 🏁 Full time. '+hs+'-'+as+'.');return}if(min===46)ev('46′ ▶️ Second half begins.');if(min%2===0)decision();move();clock.textContent=min+'′ · '+(phase==='build'?'Building from the back':phase==='attack'?'Attacking phase':'Transition');let tot=possTicks[0]+possTicks[1]||1;poss.textContent=Math.round(possTicks[0]/tot*100)+'%';shotsEl()}function shotsEl(){shots=document.__shots||shots;document.getElementById('shots').textContent=shots[0]+'-'+shots[1];document.getElementById('xg').textContent=xg[0].toFixed(2)+'-'+xg[1].toFixed(2)}mk();restart(0);for(let i=0;i<12;i++)move();ev('0′ ⚽ Riverside kick off in a genuine 4-3-3 shape.');let game=setInterval(tick,180);</script></body></html>
