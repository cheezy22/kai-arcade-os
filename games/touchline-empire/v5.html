<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Touchline Empire V5.1</title><style>*{box-sizing:border-box}body{margin:0;background:#090d14;color:#f6f8fc;font-family:system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 12px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #293247}.top b{font-size:19px}.sub{font-size:12px;color:#9aa7bd}.card{background:#141b28;border:1px solid #303b52;border-radius:18px;padding:14px;margin:12px 0}.score{text-align:center;font-size:48px;font-weight:900}.teams{text-align:center;color:#aab5c8;font-weight:700}.pitch{position:relative;width:100%;aspect-ratio:1.55;background:repeating-linear-gradient(90deg,#2e7049 0 12.5%,#296744 12.5% 25%);border:2px solid #b9d7c4;border-radius:8px;margin-top:12px;overflow:visible}.half{position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #d9eadf}.circle{position:absolute;left:42%;top:32%;width:16%;height:36%;border:1px solid #d9eadf;border-radius:50%}.spot{position:absolute;left:50%;top:50%;width:3px;height:3px;background:white;border-radius:50%;transform:translate(-50%,-50%)}.box{position:absolute;top:20%;width:16%;height:60%;border:1px solid #d9eadf}.box.l{left:0}.box.r{right:0}.six{position:absolute;top:35%;width:6%;height:30%;border:1px solid #d9eadf}.six.l{left:0}.six.r{right:0}.goal{position:absolute;top:40%;height:20%;width:3%;border:2px solid white;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff55 4px 5px)}.goal.l{left:-3%}.goal.r{right:-3%}.p{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);transition:left .16s linear,top .16s linear;z-index:5;border:1px solid #fff9;box-shadow:0 1px 4px #000}.blue{background:#69a3ff}.red{background:#ff6f7d}.gk{outline:2px solid #ffd35a}.ref{background:#111;width:11px;height:11px;outline:1px solid #ffe65b}.ball{position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);z-index:9;transition:left .12s linear,top .12s linear;box-shadow:0 1px 4px #000}.clock{text-align:center;font-weight:900;margin:8px}.comment{max-height:190px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid #2b3549;font-size:13px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}button{background:#263147;color:white;border:1px solid #40506d;border-radius:11px;padding:10px;font-weight:800}.sel{background:#496487}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{text-align:center;background:#101622;border-radius:10px;padding:8px}.stat b{display:block;font-size:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c111b;border-top:1px solid #2b3549;padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#a5b0c4}</style></head><body><div class=top><div><b>⚽ TOUCHLINE EMPIRE V5.1</b><div class=sub>Dynamic Runs + Finishing Rebalance</div></div><div style=text-align:right><b>Riverside Athletic</b><div class=sub>4-3-3 · Live tactical shape</div></div></div><div class=card><div id=score class=score>0 — 0</div><div class=teams>Riverside Athletic v Kingsport FC</div><div id=clock class=clock>0′ · Kick-off</div><div id=pitch class=pitch><div class=half></div><div class=circle></div><div class=spot></div><div class="box l"></div><div class="box r"></div><div class="six l"></div><div class="six r"></div><div class="goal l"></div><div class="goal r"></div></div><div class=stats><div class=stat><b id=poss>50%</b>Possession</div><div class=stat><b id=shots>0-0</b>Shots</div><div class=stat><b id=xg>0.00-0.00</b>xG</div></div><div class=controls><button id=bal class=sel onclick="ment='Balanced';buttons()">Balanced</button><button id=att onclick="ment='Attacking';buttons()">Attack</button><button id=def onclick="ment='Defensive';buttons()">Defend</button></div><div id=comment class=comment></div></div><div class=bottom>V5.1 · off-ball runs · overlaps · underlaps · through balls · higher shot volume · realistic goal rates</div><script>const P=document.getElementById('pitch'),C=(n,a,b)=>Math.max(a,Math.min(b,n)),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let ment='Balanced',min=0,hs=0,as=0,shots=[0,0],xg=[0,0],possTicks=[0,0],phase='build',team=0,owner=6,attackAge=0,ball={x:50,y:50,vx:0,vy:0,free:false},players=[],ref={x:50,y:58};const A=[[5,50,'GK'],[19,15,'LB'],[18,38,'CB'],[18,62,'CB'],[19,85,'RB'],[38,50,'DM'],[48,34,'LCM'],[48,66,'RCM'],[67,15,'LW'],[72,50,'ST'],[67,85,'RW']],B=A.map(a=>[100-a[0],a[1],a[2]]);function mk(){for(let t=0;t<2;t++)for(let i=0;i<11;i++){let a=(t?B:A)[i],d=document.createElement('div');d.className='p '+(t?'red':'blue')+(i===0?' gk':'');P.appendChild(d);players.push({team:t,i,role:a[2],anchorX:a[0],anchorY:a[1],x:a[0],y:a[1],tx:a[0],ty:a[1],el:d,runX:0,runY:0,runTTL:0})}let re=document.createElement('div');re.className='p ref';P.appendChild(re);ref.el=re;let be=document.createElement('div');be.className='ball';P.appendChild(be);ball.el=be}function buttons(){bal.className=ment==='Balanced'?'sel':'';att.className=ment==='Attacking'?'sel':'';def.className=ment==='Defensive'?'sel':''}function ev(s){comment.innerHTML='<div class=event>'+s+'</div>'+comment.innerHTML}function nearest(t,x,y,exclude=-1){let q=null,bd=1e9;players.forEach(p=>{if(p.team!==t||p.i===exclude)return;let d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;q=p}});return q}function assignRuns(){let dir=team===0?1:-1,ours=players.filter(p=>p.team===team&&p.i!==owner&&p.i!==0),choice=ours.sort(()=>Math.random()-.5).slice(0,3);choice.forEach(p=>{let depth=0,lane=0;if(p.role==='ST'){depth=R(15,24);lane=R(-12,12)}else if(p.role==='LW'||p.role==='RW'){depth=R(12,22);lane=p.role==='LW'?R(-5,12):R(-12,5)}else if(p.role==='LCM'||p.role==='RCM'){depth=R(10,18);lane=p.role==='LCM'?R(-10,5):R(-5,10)}else if(p.role==='LB'||p.role==='RB'){depth=R(12,20);lane=p.role==='LB'?R(-4,6):R(-6,4)}p.runX=dir*depth;p.runY=lane;p.runTTL=R(5,10)})}function shape(){let bx=ball.x,by=ball.y;players.forEach(p=>{let has=p.team===team,dir=p.team===0?1:-1,shift=C((bx-50)*.22,-12,12),width=(by-50)*.10;p.tx=p.anchorX+shift;p.ty=p.anchorY+width;if(has){let depth=phase==='attack'?1:phase==='transition'?.65:.35;if(p.role==='ST')p.tx+=dir*(10+10*depth);if(p.role==='LW'||p.role==='RW'){p.tx+=dir*(7+10*depth);p.ty+=(p.role==='LW'?-1:1)*(phase==='attack'?8:4)}if(p.role==='LCM'||p.role==='RCM')p.tx+=dir*(4+10*depth);if(p.role==='LB'||p.role==='RB')p.tx+=dir*(phase==='attack'?12:4);if(p.runTTL>0){p.tx+=p.runX;p.ty+=p.runY;p.runTTL--}}else{let retreat=phase==='attack'?10:5;p.tx-=dir*retreat;let press=nearest(p.team,bx,by);if(press===p){p.tx=bx-dir*2;p.ty=by}else if(['CB','LB','RB'].includes(p.role)){p.tx=C(p.tx,p.team===0?8:56,p.team===0?44:92)}}if(p.i===0){p.tx=p.team===0?5:95;p.ty=C(by,38,62)}p.tx=C(p.tx,3,97);p.ty=C(p.ty,4,96)})}function move(){shape();players.forEach(p=>{let speed=p.i===0?.75:1.7,dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.15){p.x+=dx/d*Math.min(speed,d);p.y+=dy/d*Math.min(speed,d)}p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'});ref.x+=(C(ball.x,25,75)-ref.x)*.10;ref.y+=(C(ball.y+8,18,82)-ref.y)*.10;ref.el.style.left=ref.x+'%';ref.el.style.top=ref.y+'%';if(ball.free){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.88;ball.vy*=.88}else{let o=players.find(p=>p.team===team&&p.i===owner);if(o){ball.x+=(o.x-ball.x)*.72;ball.y+=(o.y-ball.y)*.72}}ball.x=C(ball.x,-2,102);ball.y=C(ball.y,1,99);ball.el.style.left=ball.x+'%';ball.el.style.top=ball.y+'%'}function progressiveTarget(o){let dir=team===0?1:-1,cands=players.filter(p=>p.team===team&&p.i!==owner).map(p=>{let forward=dir*(p.x-o.x),space=nearest(1-team,p.x,p.y);let sep=space?Math.hypot(space.x-p.x,space.y-p.y):10,run=p.runTTL>0?8:0,central=12-Math.abs(50-p.y)*.12;return{p,score:forward*1.55+sep*.8+run+central+Math.random()*12}}).sort((a,b)=>b.score-a.score);return cands[Math.random()<.18?R(0,Math.min(3,cands.length-1)):0].p}function pass(){let o=players.find(p=>p.team===team&&p.i===owner),target=progressiveTarget(o),dir=team===0?1:-1,lead=target.runTTL>0?C(target.runX*.65,-13,13):0,ty=C(target.y+target.runY*.35,4,96),tx=C(target.x+lead,3,97);ball.free=true;ball.vx=(tx-ball.x)/3.2;ball.vy=(ty-ball.y)/3.2;setTimeout(()=>{let opp=nearest(1-team,tx,ty),od=opp?Math.hypot(opp.x-tx,opp.y-ty):99;if(od<4.3&&Math.random()<.30){team=1-team;owner=opp.i;phase='transition';attackAge=0;ev(min+'′ 🦶 Interception! Possession turns over.')}else{owner=target.i;attackAge++;if(dir*(target.x-50)>8||attackAge>3)phase='attack';if(target.runTTL>0&&Math.random()<.22)ev(min+'′ ➡️ Through ball finds a runner in behind.')}ball.free=false},360)}function dribble(){let o=players.find(p=>p.team===team&&p.i===owner),dir=team===0?1:-1;o.runX=dir*R(10,18);o.runY=R(-8,8);o.runTTL=3;let opp=nearest(1-team,o.x,o.y);if(opp&&Math.hypot(opp.x-o.x,opp.y-o.y)<4.5&&Math.random()<.36){if(Math.random()<.20){ev(min+'′ 📣 Foul. Referee gives the free kick.');phase='restart'}else{team=1-team;owner=opp.i;phase='transition';attackAge=0;ev(min+'′ 💥 Tackle won cleanly.')}}}function shoot(){let o=players.find(p=>p.team===team&&p.i===owner),goalX=team===0?100:0,dist=Math.abs(goalX-o.x),ang=Math.abs(50-o.y),centralBonus=ang<15?.05:0,closeBonus=dist<18?.10:dist<28?.05:0,q=C(.24+(32-dist)*.010-ang*.003+centralBonus+closeBonus,.07,.48);shots[team]++;xg[team]+=q;ball.free=true;ball.vx=(goalX-ball.x)/2.8;ball.vy=(50+R(-10,10)-ball.y)/2.8;setTimeout(()=>{if(Math.random()<q){team===0?hs++:as++;ev(min+'′ ⚽ GOAL! '+(dist<18?'Finished from close range.':'A composed finish after the move opens up the defence.'));score.textContent=hs+' — '+as}else ev(min+'′ '+(Math.random()<.58?'🧤 Saved by the goalkeeper.':'🎯 The shot flashes wide.'));restart(1-team)},300)}function restart(t){team=t;owner=0;phase='build';attackAge=0;ball.free=false;players.forEach(p=>{p.runTTL=0});let g=players.find(p=>p.team===team&&p.i===0);ball.x=g.x;ball.y=g.y}function decision(){let o=players.find(p=>p.team===team&&p.i===owner),goalX=team===0?100:0,dist=Math.abs(goalX-o.x);possTicks[team]++;if(phase==='restart'){restart(team);return}if(Math.random()<.42)assignRuns();let shootChance=dist<18?.70:dist<28?.50:dist<38?.26:.05;if(o.i!==0&&Math.random()<shootChance*(ment==='Attacking'?1.25:ment==='Defensive'?.72:1)){shoot();return}let opp=nearest(1-team,o.x,o.y),pressure=opp&&Math.hypot(opp.x-o.x,opp.y-o.y)<6;if(pressure&&Math.random()<.32)pass();else if(['LW','RW','ST'].includes(o.role)&&Math.random()<.42)dribble();else pass()}function tick(){min++;if(min>90){clearInterval(game);ev('90′ 🏁 Full time. '+hs+'-'+as+'. Shots '+shots[0]+'-'+shots[1]+'.');return}if(min===46)ev('46′ ▶️ Second half begins.');if(min%2===0)decision();move();clock.textContent=min+'′ · '+(phase==='build'?'Building from the back':phase==='attack'?'Attacking phase':'Transition');let tot=possTicks[0]+possTicks[1]||1;poss.textContent=Math.round(possTicks[0]/tot*100)+'%';document.getElementById('shots').textContent=shots[0]+'-'+shots[1];document.getElementById('xg').textContent=xg[0].toFixed(2)+'-'+xg[1].toFixed(2)}mk();restart(0);for(let i=0;i<12;i++)move();ev('0′ ⚽ Kick-off. Watch the front five break beyond the base shape when attacks develop.');let game=setInterval(tick,180);</script></body></html>
