<!DOCTYPE html>
<html lang="en">
<head>

<title>Touchline Empire</title>
<style>
:root{--bg:#0d1017;--panel:#161b26;--panel2:#1d2432;--line:#30394c;--text:#f4f6fb;--muted:#9aa6bb;--good:#45d483;--bad:#ff6470;--warn:#ffc857;--accent:#68a7ff;--accent2:#9e7bff;--shadow:0 12px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{border:0;color:var(--text);cursor:pointer}.topbar{position:sticky;top:0;z-index:20;background:rgba(13,16,23,.94);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #222a39}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:18px;margin:0;letter-spacing:.2px}.brand .sub{font-size:11px;color:var(--muted);margin-top:2px}.money{text-align:right}.money strong{display:block;font-size:15px}.money span{font-size:10px;color:var(--muted)}.main{padding:12px;max-width:980px;margin:auto}.screen{display:none;animation:fade .16s ease}.screen.active{display:block}@keyframes fade{from{opacity:.45;transform:translateY(3px)}to{opacity:1}}.card{background:linear-gradient(180deg,var(--panel),#131925);border:1px solid #273044;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:16px}.card h3{font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}.kpi b{font-size:18px;display:block}.kpi small{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:#dbe2ef;background:#151b27}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:13px;padding:13px 12px;font-weight:800;box-shadow:0 8px 22px rgba(104,167,255,.16);min-height:48px}.btn.secondary{background:#242c3b;border:1px solid #3a465c;box-shadow:none}.btn.goodb{background:linear-gradient(135deg,#22b96b,#49db91)}.btn.badb{background:linear-gradient(135deg,#dc4051,#ff6470)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.sep{height:1px;background:#283145;margin:11px 0}.list{display:flex;flex-direction:column;gap:7px}.player,.fixture,.news,.transfer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#171e2a;border:1px solid #2b3548;border-radius:13px;padding:10px}.player .name,.fixture .name{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:3px}.rating{min-width:42px;text-align:center;border-radius:10px;padding:7px;font-weight:900;background:#253044}.pos{font-size:10px;font-weight:900;letter-spacing:.6px;padding:4px 6px;border-radius:6px;background:#293349;color:#c5d1e7}.pitch{position:relative;aspect-ratio:68/100;max-height:570px;margin:auto;border-radius:18px;border:2px solid rgba(255,255,255,.18);background:linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.16) 49.6%,rgba(255,255,255,.16) 50.4%,transparent 50.4%),linear-gradient(#286142,#204f36);overflow:hidden}.pitch:before{content:"";position:absolute;left:25%;right:25%;top:42%;height:16%;border:1px solid rgba(255,255,255,.18);border-radius:50%}.slot{position:absolute;transform:translate(-50%,-50%);width:78px;min-height:43px;border-radius:11px;background:rgba(16,22,31,.9);border:1px solid rgba(255,255,255,.22);padding:5px;text-align:center;font-size:10px;box-shadow:0 6px 16px rgba(0,0,0,.24)}.slot b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .ovr{color:#9fd1ff}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}.tabs button{flex:0 0 auto;background:#202838;border:1px solid #313d53;border-radius:10px;padding:8px 10px;font-size:11px}.tabs button.active{background:#435477}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:rgba(12,15,22,.97);backdrop-filter:blur(16px);border-top:1px solid #293146;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.navbtn{background:transparent;color:#8793a8;font-size:9px;padding:6px 2px;border-radius:10px;min-height:52px}.navbtn span{display:block;font-size:20px;line-height:22px}.navbtn.active{background:#20283a;color:white}.event{padding:8px 0;border-bottom:1px solid #263044;font-size:12px}.score{font-size:40px;font-weight:1000}.matchteams{font-size:14px;font-weight:800}.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:100%;max-width:700px;background:#171d29;border:1px solid #303a4d;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:7px 4px;border-bottom:1px solid #283246;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.me{background:rgba(104,167,255,.09)}.chipbar{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:10px;background:#20293a;border:1px solid #334058;font-size:11px}.chip.sel{background:#425475}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:95px;background:#eef3ff;color:#111827;font-weight:800;padding:10px 14px;border-radius:999px;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(min-width:700px){.main{padding:18px}.dashgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.bottom{left:50%;max-width:720px;transform:translateX(-50%);border-left:1px solid #293146;border-right:1px solid #293146;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div><h1>⚽ TOUCHLINE EMPIRE</h1><div class="sub" id="dateLine">Loading club...</div></div><div class="money"><strong id="cashTop">—</strong><span id="clubTop">Riverside Athletic</span></div></div></header>
<main class="main"><section id="home" class="screen active"></section><section id="squad" class="screen"></section><section id="tactics" class="screen"></section><section id="transfers" class="screen"></section><section id="club" class="screen"></section><section id="match" class="screen"></section></main>
<nav class="bottom"><button class="navbtn active" data-screen="home"><span>🏠</span>HQ</button><button class="navbtn" data-screen="squad"><span>👥</span>Squad</button><button class="navbtn" data-screen="tactics"><span>🧠</span>Tactics</button><button class="navbtn" data-screen="transfers"><span>🔎</span>Market</button><button class="navbtn" data-screen="club"><span>🏟️</span>Club</button><button class="navbtn" data-screen="match"><span>🎙️</span>Match</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), money=n=>n>=1e6?'£'+(n/1e6).toFixed(2)+'m':'£'+Math.round(n/1000)+'k';
const names=['Callum Fraser','Jamie Kerr','Lewis Morton','Dylan McBride','Finlay Reid','Rhys Paterson','Euan Wallace','Owen Grant','Mason Boyd','Archie Quinn','Liam Murray','Kai Campbell','Ben McLean','Connor Steele','Ross Sinclair','Adam Hume','Jack Douglas','Noah Turner','Milo Hart','Alfie Burns','Aidan Cole','Ryan Knox','Theo Mercer','Lucas Hall','Sam Irvine','Max Sutherland','Jay Fulton','Cameron Bell','Dean Naismith','Rory Mackay'];
const first=['Leo','Mateo','Luka','Elias','Rafael','Nico','Jonas','Milan','Tomas','Enzo','Marco','Sami','Victor','Andrei','Ivan','Hugo','Bruno','Felix','Dario','Noel'], last=['Costa','Petrov','Novak','Silva','Meyer','Kovac','Rossi','Lind','Jensen','Moretti','Santos','Varga','Marin','Dahl','Bauer','Pinto','Neri','Ortega'];
const clubs=['Kingsport FC','Northbridge','Redhaven Town','Seaforth United','Ashbury City','Ironvale','Westmarch','Crown & Anchor FC','Oakshire','Port Albion','Dunmoor','Harbour Athletic'];
const positions=['GK','RB','CB','CB','LB','DM','CM','CM','RW','LW','ST'];
const formations={'4-3-3':[['GK',50,91],['RB',82,74],['CB',62,76],['CB',38,76],['LB',18,74],['DM',50,58],['CM',35,45],['CM',65,45],['RW',80,25],['LW',20,25],['ST',50,14]],'4-2-3-1':[['GK',50,91],['RB',82,74],['CB',62,76],['CB',38,76],['LB',18,74],['CM',38,57],['CM',62,57],['RW',78,35],['AM',50,34],['LW',22,35],['ST',50,14]],'3-4-2-1':[['GK',50,91],['CB',70,74],['CB',50,77],['CB',30,74],['RM',82,55],['CM',60,56],['CM',40,56],['LM',18,55],['AM',63,34],['AM',37,34],['ST',50,14]]};
let state;
function ageFactor(a){return a<23?1.3:a<29?1:a<32?.75:.48}
function newPlayer(i,pos){let age=rnd(18,32),ovr=rnd(58,74),pot=clamp(ovr+rnd(2,14),60,88);return{id:'p'+i,name:names[i%names.length],pos,age,ovr,pot,fit:rnd(82,100),morale:rnd(65,92),form:rnd(60,82),wage:rnd(700,3200),value:Math.round((ovr-50)*(pot-50)*ageFactor(age)*1600),contract:rnd(1,4),goals:0,apps:0,assists:0,inj:0}}
function makeState(){let sq=[];positions.forEach((p,i)=>sq.push(newPlayer(i,p)));['GK','CB','RB','LB','CM','DM','AM','RW','LW','ST','ST'].forEach((p,i)=>sq.push(newPlayer(i+11,p)));return{club:'Riverside Athletic',cash:2400000,wageBudget:46000,wages:0,week:1,year:1,points:0,w:0,d:0,l:0,gf:0,ga:0,board:72,fans:68,formation:'4-3-3',mentality:'Balanced',press:'Standard',tempo:'Normal',line:'Standard',squad:sq,market:[],news:['You have been appointed manager of Riverside Athletic.','The board expects a respectable top-half finish.'],fixtures:[],lastMatch:null}}
function genMarket(){state.market=Array.from({length:18},(_,i)=>{let age=rnd(17,32),ovr=rnd(60,81),pot=clamp(ovr+rnd(1,13),62,91);return{id:'m'+Date.now()+i,name:first[rnd(0,first.length-1)]+' '+last[rnd(0,last.length-1)],pos:['GK','RB','CB','LB','DM','CM','AM','RW','LW','ST'][rnd(0,9)],age,ovr,pot,value:Math.round((ovr-48)*(pot-49)*ageFactor(age)*2100),wage:rnd(1200,6800),scouted:Math.random()<.35}})}
function genFixtures(){state.fixtures=Array.from({length:22},(_,i)=>({week:i+1,opp:clubs[i%clubs.length],home:i%2===0,played:false,gs:null,ga:null}))}
function calcWages(){state.wages=state.squad.reduce((s,p)=>s+p.wage,0)}
function overallXI(){return [...state.squad].filter(p=>p.inj===0).sort((a,b)=>(b.ovr+b.form*.12+b.fit*.08)-(a.ovr+a.form*.12+a.fit*.08)).slice(0,11)}
function teamStrength(){let xi=overallXI();return xi.reduce((s,p)=>s+p.ovr,0)/Math.max(1,xi.length)+(state.mentality==='Attacking'?1:0)+(state.press==='High'?1:0)}
function nextFixture(){return state.fixtures.find(f=>!f.played)}
function saveSilent(){try{localStorage.setItem('touchlineEmpireSaveV2',JSON.stringify(state))}catch(e){}}
function renderTop(){document.getElementById('cashTop').textContent=money(state.cash);document.getElementById('clubTop').textContent=state.club;document.getElementById('dateLine').textContent='Week '+state.week+' · Season '+state.year+' · '+state.formation}
function renderHome(){let f=nextFixture();document.getElementById('home').innerHTML='<div class="dashgrid"><div><div class="card"><div class="row between"><div><h2>'+state.club+'</h2><span class="pill">Manager: You</span></div><div style="text-align:right"><b>'+state.points+' pts</b><div class="meta">'+state.w+'W '+state.d+'D '+state.l+'L</div></div></div><div class="sep"></div><div class="grid3"><div class="kpi"><b>'+state.board+'%</b><small>Board</small></div><div class="kpi"><b>'+state.fans+'%</b><small>Supporters</small></div><div class="kpi"><b>'+Math.round(teamStrength())+'</b><small>Team OVR</small></div></div></div><div class="card"><h2>Next Match</h2>'+(f?'<div class="fixture"><div><div class="name">'+(f.home?state.club:f.opp)+' <span class="muted">v</span> '+(f.home?f.opp:state.club)+'</div><div class="meta">League · Week '+f.week+' · '+(f.home?'Home':'Away')+'</div></div><span class="rating">'+(f.home?'🏟️':'🚌')+'</span></div><button class="btn goodb" id="playMatchBtn">PLAY MATCH</button>':'<div class="news">Season complete.</div><button class="btn" id="newSeasonBtn">START NEXT SEASON</button>')+'</div><div class="card"><h2>Inbox</h2><div class="list">'+state.news.slice(-5).reverse().map(n=>'<div class="news"><div>'+n+'</div><span>›</span></div>').join('')+'</div></div></div><div><div class="card"><h2>Club Finances</h2><div class="row between"><span class="muted">Balance</span><b>'+money(state.cash)+'</b></div><div class="row between"><span class="muted">Wage spend</span><b>'+money(state.wages)+'/wk</b></div><div class="row between"><span class="muted">Budget</span><b>'+money(state.wageBudget)+'/wk</b></div></div><div class="card"><h2>Manager Actions</h2><div class="grid2"><button class="btn secondary" id="trainBtn">🏋️ Training</button><button class="btn secondary" id="talkBtn">🗣 Team Talk</button><button class="btn secondary" id="scoutBtn">🔭 Scout</button><button class="btn secondary" id="boardBtn">💼 Board</button></div></div></div></div>';
 let b=document.getElementById('playMatchBtn');if(b)b.onclick=startMatch;b=document.getElementById('newSeasonBtn');if(b)b.onclick=newSeason;document.getElementById('trainBtn').onclick=trainingDay;document.getElementById('talkBtn').onclick=teamTalk;document.getElementById('scoutBtn').onclick=scoutRefresh;document.getElementById('boardBtn').onclick=boardMeeting}
function renderSquad(){document.getElementById('squad').innerHTML='<div class="card"><div class="row between"><h2>First Team Squad</h2><span class="pill">'+state.squad.length+' players</span></div><div class="list">'+[...state.squad].sort((a,b)=>b.ovr-a.ovr).map(p=>'<div class="player" data-player="'+p.id+'"><div><div class="name"><span class="pos">'+p.pos+'</span> '+p.name+'</div><div class="meta">Age '+p.age+' · Fit '+p.fit+'% · Morale '+p.morale+'% · '+(p.inj?'🚑 '+p.inj+'w injury':'£'+p.wage+'/wk')+'</div></div><div class="rating">'+p.ovr+'</div></div>').join('')+'</div></div>';document.querySelectorAll('[data-player]').forEach(x=>x.onclick=()=>playerModal(x.dataset.player))}
function selector(label,key,opts){return'<div style="margin-bottom:12px"><div class="meta" style="margin-bottom:6px">'+label+'</div><div class="chipbar">'+opts.map(x=>'<button class="chip '+(state[key]===x?'sel':'')+'" data-tac="'+key+'" data-val="'+x+'">'+x+'</button>').join('')+'</div></div>'}
function renderTactics(){let xi=overallXI(),shape=formations[state.formation];document.getElementById('tactics').innerHTML='<div class="card"><div class="row between"><h2>Tactical Board</h2><span class="pill">Team '+Math.round(teamStrength())+'</span></div><div class="tabs">'+Object.keys(formations).map(f=>'<button class="'+(state.formation===f?'active':'')+'" data-form="'+f+'">'+f+'</button>').join('')+'</div><div class="pitch">'+shape.map((s,i)=>{let p=xi[i]||{name:'Vacant',ovr:'--'};return'<div class="slot" style="left:'+s[1]+'%;top:'+s[2]+'%"><small>'+s[0]+'</small><b>'+p.name.split(' ').slice(-1)+'</b><span class="ovr">'+p.ovr+'</span></div>'}).join('')+'</div></div><div class="card"><h2>Team Instructions</h2>'+selector('Mentality','mentality',['Defensive','Balanced','Attacking'])+selector('Press','press',['Low','Standard','High'])+selector('Tempo','tempo',['Slow','Normal','Fast'])+selector('Defensive line','line',['Deep','Standard','High'])+'</div>';document.querySelectorAll('[data-form]').forEach(x=>x.onclick=()=>{state.formation=x.dataset.form;renderAll()});document.querySelectorAll('[data-tac]').forEach(x=>x.onclick=()=>{state[x.dataset.tac]=x.dataset.val;renderAll()})}
function renderTransfers(){document.getElementById('transfers').innerHTML='<div class="card"><div class="row between"><h2>Transfer Centre</h2><button class="chip" id="marketRefresh">Refresh</button></div><div class="meta">Cash '+money(state.cash)+' · Squad '+state.squad.length+'</div><div class="sep"></div><div class="list">'+state.market.map(p=>'<div class="transfer" data-market="'+p.id+'"><div><div class="name"><span class="pos">'+p.pos+'</span> '+p.name+'</div><div class="meta">Age '+p.age+' · '+(p.scouted?'OVR '+p.ovr+' / POT '+p.pot:'OVR ?? / POT ??')+' · '+money(p.value)+'</div></div><span class="rating">'+(p.scouted?p.ovr:'?')+'</span></div>').join('')+'</div></div>';document.getElementById('marketRefresh').onclick=scoutRefresh;document.querySelectorAll('[data-market]').forEach(x=>x.onclick=()=>marketModal(x.dataset.market))}
function renderClub(){document.getElementById('club').innerHTML='<div class="card"><h2>Club Overview</h2><div class="grid3"><div class="kpi"><b>'+state.points+'</b><small>Points</small></div><div class="kpi"><b>'+(state.gf-state.ga)+'</b><small>Goal diff</small></div><div class="kpi"><b>'+state.board+'%</b><small>Board</small></div></div><div class="sep"></div><div class="news"><div>Season target: Top half</div><span>🎯</span></div><div class="news"><div>Transfer balance: '+money(state.cash)+'</div><span>💷</span></div></div>'}
function renderMatch(){let lm=state.lastMatch;document.getElementById('match').innerHTML='<div class="card" style="text-align:center"><h2>Match Centre</h2>'+(lm?'<div class="matchteams">'+lm.home+' vs '+lm.away+'</div><div class="score">'+lm.hs+' — '+lm.as+'</div><div class="pill">'+lm.resultText+'</div><div class="sep"></div><div style="text-align:left">'+lm.events.map(e=>'<div class="event">'+e+'</div>').join('')+'</div>':'<div class="muted">No match played yet. The commentary team are eating crisps and pretending to study xG.</div>')+'</div>'}
function renderAll(){calcWages();renderTop();renderHome();renderSquad();renderTactics();renderTransfers();renderClub();renderMatch();saveSilent()}
function navigate(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.screen===s));window.scrollTo(0,0)}
function trainingDay(){state.squad.forEach(p=>{if(!p.inj){p.fit=clamp(p.fit-rnd(2,6),40,100);p.form=clamp(p.form+rnd(0,3),40,100);if(Math.random()<.018){p.inj=rnd(1,4);state.news.push(p.name+' picked up an injury in training.')}}});renderAll();toast('Training completed')}
function teamTalk(){state.squad.forEach(p=>p.morale=clamp(p.morale+rnd(-2,6),35,100));renderAll();toast('Dressing room addressed')}
function scoutRefresh(){if(state.cash>=15000)state.cash-=15000;genMarket();renderAll();toast('Scouting network refreshed')}
function boardMeeting(){let swing=rnd(-6,7);state.board=clamp(state.board+swing,0,100);state.news.push(swing>=0?'Board meeting went well.':'The board wants improved results.');renderAll();toast('Board meeting complete')}
function playerModal(id){let p=state.squad.find(x=>x.id===id);showModal('<h2>'+p.name+'</h2><div class="grid3"><div class="kpi"><b>'+p.ovr+'</b><small>OVR</small></div><div class="kpi"><b>'+p.pot+'</b><small>POT</small></div><div class="kpi"><b>'+p.form+'</b><small>Form</small></div></div><div class="sep"></div><div class="row between"><span>Position</span><b>'+p.pos+'</b></div><div class="row between"><span>Age</span><b>'+p.age+'</b></div><div class="row between"><span>Value</span><b>'+money(p.value)+'</b></div><div class="row between"><span>Contract</span><b>'+p.contract+' yrs</b></div>')}
function marketModal(id){let p=state.market.find(x=>x.id===id);showModal('<h2>'+p.name+'</h2><div class="grid3"><div class="kpi"><b>'+(p.scouted?p.ovr:'?')+'</b><small>OVR</small></div><div class="kpi"><b>'+(p.scouted?p.pot:'?')+'</b><small>POT</small></div><div class="kpi"><b>'+p.age+'</b><small>Age</small></div></div><div class="sep"></div><div class="row between"><span>Value</span><b>'+money(p.value)+'</b></div><button class="btn goodb" id="signPlayer">SIGN PLAYER</button>');document.getElementById('signPlayer').onclick=()=>buyPlayer(id)}
function buyPlayer(id){let p=state.market.find(x=>x.id===id);if(!p||state.cash<p.value)return toast('Transfer budget says naw');state.cash-=p.value;p.id='p'+Date.now();p.fit=95;p.morale=82;p.form=70;p.contract=4;p.goals=p.apps=p.assists=p.inj=0;state.squad.push(p);state.market=state.market.filter(x=>x.id!==id);state.news.push('Signed '+p.name+' for '+money(p.value)+'.');closeModal();renderAll();toast('Signing completed')}
function showModal(h){document.getElementById('sheet').innerHTML=h+'<button class="btn secondary" id="closeSheet" style="margin-top:10px">Close</button>';document.getElementById('modal').classList.add('show');document.getElementById('closeSheet').onclick=closeModal}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L);return Math.min(k-1,6)}
function startMatch(){let f=nextFixture();if(!f)return;let my=teamStrength(),opp=rnd(61,76),myXg=clamp(1.15+(my-opp)/12+(state.mentality==='Attacking'?.35:state.mentality==='Defensive'?-.22:0)+(f.home?.35:0),.25,3.8),opXg=clamp(1.15+(opp-my)/13,.25,3.5),gs=poisson(myXg),ga=poisson(opXg),events=[],xi=overallXI(),scorers=xi.filter(p=>['ST','RW','LW','AM','CM'].includes(p.pos));for(let i=0;i<gs;i++){let p=scorers[rnd(0,Math.max(0,scorers.length-1))]||xi[0],min=rnd(6,89);p.goals++;events.push(min+"' ⚽ "+p.name+' scores for '+state.club+'.')}for(let i=0;i<ga;i++)events.push(rnd(8,90)+"' ⚽ "+f.opp+' find the net.');events.sort((a,b)=>parseInt(a)-parseInt(b));f.played=true;state.gf+=gs;state.ga+=ga;let rt;if(gs>ga){state.w++;state.points+=3;state.board=clamp(state.board+3,0,100);rt='VICTORY';state.cash+=rnd(45000,90000)}else if(gs===ga){state.d++;state.points++;rt='DRAW';state.cash+=rnd(25000,55000)}else{state.l++;state.board=clamp(state.board-4,0,100);rt='DEFEAT';state.cash+=rnd(18000,40000)}state.lastMatch={home:f.home?state.club:f.opp,away:f.home?f.opp:state.club,hs:f.home?gs:ga,as:f.home?ga:gs,resultText:rt,events:events.length?events:['A tactical arm-wrestle. Nobody will be buying the DVD.']};state.news.push(rt+': '+state.club+' '+gs+'-'+ga+' '+f.opp+'.');state.week++;state.squad.forEach(p=>{p.fit=clamp(p.fit+rnd(2,8),45,100);if(p.inj>0)p.inj--});renderAll();navigate('match')}
function newSeason(){state.year++;state.week=1;state.points=state.w=state.d=state.l=state.gf=state.ga=0;genFixtures();genMarket();state.news.push('Season '+state.year+' begins.');renderAll();navigate('home')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.screen)));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
try{let raw=localStorage.getItem('touchlineEmpireSaveV2');state=raw?JSON.parse(raw):makeState()}catch(e){state=makeState()}if(!state.fixtures||!state.fixtures.length)genFixtures();if(!state.market||!state.market.length)genMarket();renderAll();
})();
</script>
</body></html>
