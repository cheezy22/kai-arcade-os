pse;font-size:11px}.table td,.table th{padding:7px 3px;border-bottom:1px solid #283448;text-align:right}.table td:first-child,.table th:first-child{text-align:left}.me{background:#72aaff12}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:white;color:#111;padding:9px 13px;border-radius:99px;font-size:12px;font-weight:800;opacity:0;z-index:40}.toast.on{opacity:1}</style></head><body><header class="top"><div class="row bt"><div><h1>⚽ TOUCHLINE EMPIRE V2</h1><div id="date" class="sub"></div></div><div style="text-align:right"><b id="cash"></b><div id="club" class="sub"></div></div></div></header><main class="main"><section id="home" class="screen on"></section><section id="squad" class="screen"></section><section id="tactics" class="screen"></section><section id="market" class="screen"></section><section id="clubpg" class="screen"></section><section id="match" class="screen"></section></main><nav class="bottom"><button class="nav sel" data-s="home"><span>🏠</span>HQ</button><button class="nav" data-s="squad"><span>👥</span>Squad</button><button class="nav" data-s="tactics"><span>🧠</span>Tactics</button><button class="nav" data-s="market"><span>🔎</span>Market</button><button class="nav" data-s="clubpg"><span>🏟️</span>Club</button><button class="nav" data-s="match"><span>🎙️</span>Match</button></nav><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>(function(){'use strict';const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,C=(n,a,b)=>Math.max(a,Math.min(b,n)),M=n=>n>=1e6?'£'+(n/1e6).toFixed(2)+'m':'£'+Math.round(n/1000)+'k';const F=['Callum','Jamie','Lewis','Dylan','Finlay','Rhys','Euan','Owen','Mason','Archie','Liam','Kai','Ben','Connor','Ross','Adam','Jack','Noah','Milo','Alfie','Aidan','Ryan','Theo','Lucas','Sam','Max','Leo','Mateo','Luka','Elias','Rafael','Nico'],L=['Fraser','Kerr','Morton','McBride','Reid','Paterson','Wallace','Grant','Boyd','Quinn','Murray','Campbell','Mc ction init(){try{S=JSON.parse(localStorage.getItem('TEV2FULL'))||fresh()}catch(e){S=fresh()}if(!S.fixtures||!S.fixtures.length)fixtures();if(!S.market||!S.market.length)genMarket();render()}function wages(){return S.squad.reduce((a,p)=>a+p.wage,0)}function fixtures(){S.fixtures=[];for(let i=0;i<22;i++)S.fixtures.push({opp:CL[i%CL.length],home:i%2===0,played:false,cup:false});S.fixtures.splice(5,0,{opp:CL[R(0,CL.length-1)],home:true,played:false,cup:true})}function genMarket(){S.market=[];for(let i=0;i<22;i++){let p=mk(100+i,POS[R(0,9)]);p.ov=C(p.ov+R(1,8),60,83);p.pot=C(p.ov+R(2,13),p.ov,93);p.value=Math.round(p.value*1.3);p.ask=Math.round(p.value*(.85+Math.random()*.5));p.club=CL[R(0,CL.length-1)];p.scout=R(10,100);S.market.push(p)}}function XI(){return [...S.squad].filter(p=>!p.inj).sort((a,b)=>(b.ov+b.form*.1+b.fit*.08+b.mor*.05)-(a.ov+a.form*.1+a.fit*.08+a.mor*.05)).slice(0,11)}function strength(){let x=XI();return x.reduce((a,p)=>a+p.ov,0)/Math.max(1,x.length)+(S.mentality==='Attacking'?1:0)+(S.press==='High'?.8:0)}function nf(){return S.fixtures.find(f=>!f.played)}function top(){cash.textContent=M(S.cash);club.textContent=S.club;date.textContent='Season '+S.season+' · Week '+S.week+' · Division '+S.div}function homepg(){let f=nf(),urgent=S.squad.filter(p=>p.contract===1).slice(0,3);home.innerHTML='<div class="card"><div class="row bt"><div><h3>'+S.club+'</h3><div class="meta">Manager reputation '+S.rep+'</div></div><div><b>'+S.points+' pts</b><div class="meta">'+S.w+'W '+S.d+'D '+S.l+'L</div></div></div><div class="grid"><div class="kpi"><b>'+S.board+'%</b><small>Board</small></div><div class="kpi"><b>'+S.fans+'%</b><small>Fans</small></div><div class="kpi"><b>'+Math.round(strength())+'</b><small>OVR</small></div></div></div><div class="card"><h3>Next Match</h3>'+(f?'<div class="item"><div><div class="name">'+(f.home?S.club:f.opp)+' v '+(f.home?f.opp:S.club)+'</div><div class="meta">'+(f.cup?'🏆 Cup':'League')+' · '+(f.home?'Home':'Away')+'</div></div><span>⚽</span></div><button class="btn good" onclick="TE.start()">PLAY MATCH</button>':'<button class="btn" onclick="TE.nextSeason()">NEXT SEASON</button>')+'</div><div class="card"><h3>Manager Desk</h3><div class="grid"><button class="btn sec" onclick="TE.train()">🏋️ Train</button><button class="btn sec" onclick="TE.talk()">🗣 Talk</button><button class="btn sec" onclick="TE.youth()">🌱 Youth</button></div><div class="sep"></div><div class="row bt"><span class="meta">Wages</span><b>'+M(wages())+'/wk</b></div><div class="row bt"><span class="meta">Budget</span><b>'+M(S.wageBudget)+'/wk</b></div></div><div class="card"><h3>Inbox</h3>'+S.news.slice(-6).reverse().map(n=>'<div class="item"><div>'+n+'</div><span>›</span></div>').join('')+'</div><div class="card"><h3>Contract Watch</h3>'+(urgent.length?urgent.map(p=>'<div class="item"><div><b>'+p.name+'</b><div class="meta">Expires this season</div></div><button class="chip" onclick="TE.player(\''+p.id+'\')">Talk</button></div>').join(''):'<div class="meta">No urgent renewals.</div>')+'</div>'}function squadpg(){squad.innerHTML='<div class="card"><h3>First Team</h3>'+[...S.squad].sort((a,b)=>b.ov-a.ov).map(p=>'<div class="item" onclick="TE.player(\''+p.id+'\')"><div><div class="name"><span class="pos">'+p.pos+'</span> '+p.name+'</div><div class="meta">'+p.person+' · Fit '+p.fit+' · Mor '+p.mor+(p.inj?' · 🚑 '+p.inj+'w':'')+'</div></div><div class="rate">'+p.ov+'</div></div>').join('')+'</div>'}function sel(k,a){return '<div class="chips">'+a.map(v=>'<button class="chip '+(S[k]===v?'sel':'')+'" onclick="TE.set(\''+k+'\',\''+v+'\')">'+v+'</button>').join('')+'</div>'}function tacticspg(){let x=XI(),sh=SH[S.formation];tactics.innerHTML='<div class="card"><div class="chips">'+Object.keys(SH).map(f=>'<button class="chip '+(f===S.formation?'sel':'')+'" onclick="TE.setF(\''+f+'\')">'+f+'</button>').join('')+'</div><div class="pitch">'+sh.map((s,i)=>{let p=x[i]||{name:'Vacant',ov:'--'};return '<div class="slot" style="left:'+s[1]+'%;top:'+s[2]+'%"><span>'+s[0]+'</span><b>'+p.name.split(' ').slice(-1)+'</b><span>'+p.ov+'</span></div>'}).join('')+'</div></div><div class="card"><h3>Instructions</h3><div class="meta">Mentality</div>'+sel('mentality',['Defensive','Balanced','Attacking'])+'<div class="meta">Press</div>'+sel('press',['Low','Standard','High'])+'<div class="meta">Tempo</div>'+sel('tempo',['Slow','Normal','Fast'])+'<div class="meta">Width</div>'+sel('width',['Narrow','Balanced','Wide'])+'<div class="meta">Training</div>'+sel('training',['Recovery','Balanced','Fitness','Tactical','Attacking'])+'</div>'}function marketpg(){market.innerHTML='<div class="card"><div class="row bt"><div><h3>Scouting Centre</h3><div class="meta">Network '+S.scouting+'/5</div></div><button class="chip" onclick="TE.refresh()">Refresh £15k</button></div>'+S.market.map(p=>{let k=p.scout>45-S.scouting*5;return '<div class="item" onclick="TE.target(\''+p.id+'\')"><div><div class="name"><span class="pos">'+p.pos+'</span> '+p.name+'</div><div class="meta">'+p.club+' · Age '+p.age+' · '+(k?'OVR '+p.ov+' POT '+p.pot:'Ability uncertain')+' · '+M(p.ask)+'</div></div><div class="rate">'+(k?p.ov:'?')+'</div></div>'}).join('')+'</div>'}function clubpage(){let tbl=CL.map(c=>({c,pts:R(Math.max(0,S.points-8),S.points+12),gd:R(-12,18)}));tbl.push({c:S.club,pts:S.points,gd:S.gf-S.ga});tbl.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);clubpg.innerHTML='<div class="card"><h3>League Table</h3><table class="table"><tr><th>Club</th><th>GD</th><th>Pts</th></tr>'+tbl.map((r,i)=>'<tr class="'+(r.c===S.club?'me':'')+'"><td>'+(i+1)+'. '+r.c+'</td><td>'+r.gd+'</td><td><b>'+r.pts+'</b></td></tr>').join('')+'</table></div><div class="card"><h3>Club Development</h3>'+upgrade('Training','facilities',500000)+upgrade('Academy','academy',650000)+upgrade('Scouting','scouting',550000)+'</div><div class="card"><h3>Career History</h3>'+(S.history.length?S.history.slice().reverse().map(h=>'<div class="item"><div><b>Season '+h.s+'</b><div class="meta">'+h.f+' · '+h.r+'</div></div><span>🏁</span></div>').join(''):'<div class="meta">Your legend starts here.</div>')+'</div>'}function upgrade(n,k,c){return '<div class="row bt" style="margin:8px 0"><div><b>'+n+'</b><div class="meta">Level '+S[k]+'/5</div></div><button class="chip" onclick="TE.up(\''+k+'\','+c+')">'+(S[k]>=5?'MAX':M(c*S[k]))+'</button></div>'}function matchpg(){let l=S.lastMatch;match.innerHTML='<div class="card"><div id="mh">'+(l?'<div class="score">'+l.hs+' — '+l.as+'</div><div class="meta" style="text-align:center">'+l.home+' v '+l.away+'</div>':'<div class="meta" style="text-align:center">No match played yet.</div>')+'</div><div id="mp" class="mp"></div><div id="events" class="events">'+(l?l.events.map(e=>'<div class="ev">'+e+'</div>').join(''):'')+'</div></div>'}function render(){top();homepg();squadpg();tacticspg();marketpg();clubpage();matchpg()}function nav(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(s).classList.add('on');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('sel',x.dataset.s===s));if(s==='match')paint()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1200)}function modal(h){sheet.innerHTML=h+'<button class="btn sec" style="margin-top:9px" onclick="TE.close()">Close</button>';modalEl().classList.add('on')}function modalEl(){return document.getElementById('modal')}function close(){modalEl().classList.remove('on')}function player(id){let p=S.squad.find(x=>x.id===id);modal('<h2>'+p.name+'</h2><div class="grid"><div class="kpi"><b>'+p.ov+'</b><small>OVR</small></div><div class="kpi"><b>'+p.pot+'</b><small>POT</small></div><div class="kpi"><b>'+p.age+'</b><small>Age</small></div></div><div class="sep"></div><div class="row bt"><span>Personality</span><b>'+p.person+'</b></div><div class="row bt"><span>Consistency</span><b>'+p.cons+'/15</b></div><div class="row bt"><span>Big matches</span><b>'+p.big+'/15</b></div><div class="row bt"><span>Contract</span><b>'+p.contract+' yrs</b></div><div class="row bt"><span>Wage</span><b>£'+p.wage+'/wk</b></div><div class="sep"></div><button class="btn" onclick="TE.renew(\''+p.id+'\')">New Contract</button><button class="btn bad" style="margin-top:7px" onclick="TE.sell(\''+p.id+'\')">Sell Player</button>')}function renew(id){let p=S.squad.find(x=>x.id===id),w=Math.round(p.wage*(1.12+Math.random()*.2)),b=w*10;if(S.cash<b)return toast('Not enough cash');if(p.person==='Ambitious'&&Math.random()<.12)return toast('Player rejected talks');S.cash-=b;p.wage=w;p.contract=4;p.mor=C(p.mor+7,0,100);close();render();toast('Contract agreed')}function sell(id){let p=S.squad.find(x=>x.id===id),fee=Math.round(p.value*(.75+Math.random()*.45));S.cash+=fee;S.squad=S.squad.filter(x=>x.id!==id);S.news.push(p.name+' sold for '+M(fee)+'.');close();render()}function target(id){let p=S.market.find(x=>x.id===id),k=p.scout>45-S.scouting*5;modal('<h2>'+p.name+'</h2><div class="grid"><div class="kpi"><b>'+(k?p.ov:'?')+'</b><small>OVR</small></div><div class="kpi"><b>'+(k?p.pot:'?')+'</b><small>POT</small></div><div class="kpi"><b>'+p.age+'</b><small>Age</small></div></div><div class="sep"></div><div class="row bt"><span>Club</span><b>'+p.club+'</b></div><div class="row bt"><span>Price</span><b>'+M(p.ask)+'</b></div><div class="row bt"><span>Personality</span><b>'+(k?p.person:'Unknown')+'</b></div><div class="sep"></div><button class="btn sec" onclick="TE.scout(\''+p.id+'\')">Scout £5k</button><button class="btn good" style="margin-top:7px" onclick="TE.negotiate(\''+p.id+'\')">Negotiate</button>')}function scout(id){let p=S.market.find(x=>x.id===id);if(S.cash<5000)return toast('No cash');S.cash-=5000;p.scout=100;close();render();target(id)}function negotiate(id){let p=S.market.find(x=>x.id===id),low=Math.round(p.ask*.9);modal('<h2>Transfer Negotiation</h2><div class="item"><div><b>'+p.club+'</b><div class="meta">Asking '+M(p.ask)+'</div></div><span>🤝</span></div><button class="btn sec" onclick="TE.bid(\''+id+'\','+low+')">Bid '+M(low)+'</button><button class="btn" style="margin-top:7px" onclick="TE.bid(\''+id+'\','+p.ask+')">Meet '+M(p.ask)+'</button>')}function bid(id,fee){let p=S.market.find(x=>x.id===id);if(S.cash<fee)return toast('Transfer budget says naw');if(fee<p.ask*.92&&Math.random()>.25){p.ask=Math.round(p.ask*1.05);close();render();return toast('Bid rejected')}let wage=Math.round(p.wage*1.15),bonus=wage*10;if(S.cash<fee+bonus)return toast('Need signing bonus');S.cash-=fee+bonus;p.id='p'+Date.now();p.wage=wage;p.contract=4;p.fit=96;p.mor=84;p.inj=0;p.apps=0;p.goals=0;S.squad.push(p);S.market=S.market.filter(x=>x!==p);S.news.push('Signed '+p.name+' for '+M(fee)+'.');close();render();toast('Signing complete')}function train(){let hard=S.training==='Fitness'||S.training==='Attacking'||S.training==='Tactical';S.squad.forEach(p=>{if(p.inj)return;p.fit=C(p.fit+(S.training==='Recovery'?R(5,10):-R(1,5)),35,100);p.form=C(p.form+R(0,hard?2:1),30,100);if(Math.random()<(hard?.025:.012)){p.inj=R(1,4);S.news.push(p.name+' injured in training.')}});let y=S.squad.filter(p=>p.age<24&&p.ov<p.pot);if(y.length&&Math.random()<.3){let p=y[R(0,y.length-1)];p.ov++;S.news.push(p.name+' improved to '+p.ov+' OVR.')}render();toast('Training done')}function talk(){let n=R(-2,6);S.squad.forEach(p=>p.mor=C(p.mor+n+(p.person==='Leader'?1:0),20,100));S.news.push(n>2?'Team meeting lifted morale.':'Mixed reaction to the team meeting.');render()}function youth(){if(Math.random()<.45+S.academy*.08){let p=mk(Date.now(),POS[R(0,9)]);p.age=R(16,18);p.ov=R(52+S.academy*2,58+S.academy*2);p.pot=C(p.ov+R(10,22),70,94);p.wage=R(200,700);S.squad.push(p);S.news.push('Academy prospect '+p.name+' promoted.');render();toast('Youth prospect found')}else toast('No standout prospect')}function refresh(){if(S.cash<15000)return toast('No cash');S.cash-=15000;genMarket();render()}function up(k,b){if(S[k]>=5)return;let c=b*S[k];if(S.cash<c)return toast('No cash');S.cash-=c;S[k]++;render();toast('Upgrade complete')}function paint(){let e=document.getElementById('mp');if(!e)return;e.innerHTML='';for(let i=0;i<22;i++){let d=document.createElement('div');d.className='dot '+(i<11?'us':'them');d.style.left=(i<11?15+R(-6,20):85-R(-6,20))+'%';d.style.top=R(8,92)+'%';e.appendChild(d)}}function start(){let f=nf();if(!f)return;nav('match');MS={f,min:0,hs:0,as:0,mx:C(1.15+(strength()-R(62,78))/12+(S.mentality==='Attacking'?.3:0),.25,3.6),ox:C(1.1+(R(62,78)-strength())/13,.25,3.4),events:[]};setup();T=setInterval(tick,420)}function setup(){let e=document.getElementById('mp');e.innerHTML='';for(let i=0;i<22;i++){let d=document.createElement('div');d.className='dot '+(i<11?'us':'them');e.appendChild(d)}let b=document.createElement('div');b.className='ball';b.id='ball';e.appendChild(b);document.getElementById('events').innerHTML='';document.getElementById('mh').innerHTML='<div id="live" class="score">0 — 0</div><div class="meta" style="text-align:center">'+(MS.f.home?S.club:MS.f.opp)+' v '+(MS.f.home?MS.f.opp:S.club)+'</div>';move()}function move(){document.querySelectorAll('#mp .dot').forEach((d,i)=>{d.style.left=C((i<11?18:82)+(i<11?1:-1)*(MS.min/90)*25+R(-8,8),5,95)+'%';d.style.top=R(7,93)+'%'});let b=document.getElementById('ball');if(b){b.style.left=R(8,92)+'%';b.style.top=R(8,92)+'%'}}function evt(s){MS.events.push(s);let d=document.createElement('div');d.className='ev';d.textContent=s;events.prepend(d)}function scorer(){let a=XI().filter(p=>['ST','RW','LW','AM','CM'].includes(p.pos)),p=a[R(0,a.length-1)]||XI()[0];if(p)p.goals++;return p?p.name:'Riverside'}function tick(){MS.min+=3;move();if(Math.random()<MS.mx/30){MS.hs++;evt(MS.min+'\' ⚽ '+scorer()+' scores!')}if(Math.random()<MS.ox/30){MS.as++;evt(MS.min+'\' ⚽ '+MS.f.opp+' score.')}if(Math.random()<.04)evt(MS.min+'\' 🟨 Booking.');live.textContent=(MS.f.home?MS.hs:MS.as)+' — '+(MS.f.home?MS.as:MS.hs);if(MS.min>=90)finish()}function finish(){clearInterval(T);let f=MS.f,gs=MS.hs,ga=MS.as;f.played=true;S.gf+=gs;S.ga+=ga;let r;if(gs>ga){S.w++;if(!f.cup)S.points+=3;S.board=C(S.board+3,0,100);S.fans=C(S.fans+3,0,100);S.cash+=R(50000,95000);r='Victory'}else if(gs===ga){S.d++;if(!f.cup)S.points++;S.cash+=R(25000,50000);r='Draw'}else{S.l++;S.board=C(S.board-4,0,100);S.fans=C(S.fans-3,0,100);r='Defeat'}XI().forEach(p=>{p.apps++;p.fit=C(p.fit-R(7,15),35,100)});S.lastMatch={home:f.home?S.club:f.opp,away:f.home?f.opp:S.club,hs:f.home?gs:ga,as:f.home?ga:gs,events:MS.events};S.news.push(r+': '+S.club+' '+gs+'-'+ga+' '+f.opp+'.');S.cash-=wages();S.week++;S.squad.forEach(p=>{p.fit=C(p.fit+R(7,13),0,100);if(p.inj)p.inj--});save();render();nav('match')}function nextSeason(){let f=S.points>=48?'Promotion achieved':S.points>=35?'Top-half finish':'Underwhelming season';S.history.push({s:S.season,f,r:S.w+'W '+S.d+'D '+S.l+'L'});if(S.points>=48){S.div=Math.max(1,S.div-1);S.rep=C(S.rep+8,0,100)}else if(S.points<25){S.div=Math.min(3,S.div+1);S.rep=C(S.rep-5,0,100)}S.season++;S.week=1;S.points=S.w=S.d=S.l=S.gf=S.ga=0;S.squad.forEach(p=>{p.age++;p.contract--;if(p.age<25&&p.ov<p.pot&&Math.random()<.55)p.ov++;if(p.contract<1)p.contract=1});fixtures();genMarket();S.news.push('Season '+S.season+' begins in Division '+S.div+'.');render();nav('home')}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.s));modalEl().onclick=e=>{if(e.target.id==='modal')close()};window.TE={save,player,renew,sell,target,scout,negotiate,bid,train,talk,youth,refresh,up,start,nextSeason,close,set:(k,v)=>{S[k]=v;render()},setF:f=>{S.formation=f;render()}};window.addEventListener('beforeunload',save);init()})();</script></body></html>
